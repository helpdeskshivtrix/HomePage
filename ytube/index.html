<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root{--bg:#030407;--panel:#0b0f17;--panel2:#101620;--line:#1b2635;--blue:#0066ff;--blue2:#00a8ff;--neon:#00eaff;--text:#f4f7fb;--muted:#8e9bad;--red:#ff4268}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.mut{color:var(--muted)}
.btn{height:38px;padding:0 14px;border-radius:19px;border:1px solid #1e2c3f;background:#0b111a;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#28527b}.btn.pri{border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;font-size:18px;display:grid;place-items:center}
.ib:hover{background:#101a28}.ib.on{color:var(--neon)}.ib.big{width:54px;height:54px;background:#fff;color:#000;font-size:22px}
.ib.liked{color:var(--red)}
/* top bar */
#top{position:fixed;inset:0 0 auto 0;height:64px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(3,4,7,.92);backdrop-filter:blur(16px);border-bottom:1px solid #0e1622}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;letter-spacing:-.5px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#0055ff,#00d9ff);box-shadow:0 0 16px rgba(0,170,255,.45);font-size:13px}
.brand b{color:var(--neon)}
#q{flex:1;max-width:560px;margin:0 auto;height:42px;border-radius:21px;border:1px solid #1b2a3e;background:#0a0f17;padding:0 18px;outline:none}
#q:focus{border-color:rgba(0,234,255,.55)}
/* sidebar */
#side{position:fixed;top:64px;bottom:0;left:0;width:240px;z-index:40;padding:10px 12px 90px;overflow-y:auto;background:var(--bg);border-right:1px solid #0e1622;transition:transform .2s}
.nv{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:none;text-align:left;font-weight:700;font-size:14px;color:#c9d4e2}
.nv:hover{background:#0d1622}.nv.on{background:#13243b;color:#fff}
.nv small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.sh{padding:16px 14px 6px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:10px 4px}
#main{position:absolute;top:64px;bottom:0;left:240px;right:0;overflow-y:auto;padding:16px 22px 120px}
/* pills */
.slide{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.pills{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:9px;border:1px solid #1a293b;background:#0b121c;font-size:13px;font-weight:700;color:#c3cfdf}
.pill.on{background:#fff;color:#000;border-color:#fff}
.ar{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #1a293b;background:#0b121c}
h1.vt{font-size:26px;margin:4px 0 14px;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.cd{position:relative;cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#05070a}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.art{width:100%;height:100%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#0a3a8a,#04122e)}
.du{position:absolute;right:6px;bottom:6px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.8);font-size:11px;font-weight:800}
.ca{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px}
.ca button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px}
.ca button:hover{background:rgba(0,120,255,.9)}.ca .liked{color:var(--red)}
@media(hover:hover){.ca{opacity:0;transition:.15s}.cd:hover .ca{opacity:1}}
.ct{margin-top:8px;font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:12px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{height:84px;border-radius:12px;border:0;font-weight:800;font-size:16px;text-align:left;padding:14px;background:linear-gradient(135deg,#0b3d91,#06142f)}
.tile:hover{background:linear-gradient(135deg,var(--blue),#06142f)}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--muted)}
.spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid #17314d;border-top-color:var(--neon);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* mini bar */
#mini{display:none;position:fixed;left:240px;right:0;bottom:0;z-index:60;height:68px;align-items:center;gap:10px;padding:0 14px;background:#0b1320;border-top:1px solid var(--line)}
body.mini #mini{display:flex}
#mini img{width:88px;height:50px;object-fit:cover;border-radius:8px;background:#000;flex:none}
#mini .tx{flex:1;min-width:0;cursor:pointer}
#mini .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* player overlay */
#pl{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#06101f,#030407 60%);transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#pl.open{transform:none}
.plh{height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;flex:none}
.plh b{flex:1;font-size:16px}
.plb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;padding:0 22px 18px}
.pll{overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.vbox{position:relative;width:min(100%,760px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
#ytp,#ytp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.oart,#au{display:none}
.vbox.offl #ytp{display:none}.vbox.offl .oart{display:grid;position:absolute;inset:0;place-items:center;font-size:80px;background:linear-gradient(135deg,#0a3a8a,#04122e)}
.vbox.offl #au{display:block;position:absolute;left:0;right:0;bottom:0;width:100%;z-index:2}
.pll h2{width:min(100%,760px);margin:16px 0 2px;font-size:20px}
.pll .mut{width:min(100%,760px);font-weight:700}
#seek{width:min(100%,760px);margin-top:14px;accent-color:var(--blue2)}
.tm{width:min(100%,760px);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.plr{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:16px;background:rgba(11,15,23,.8)}
.from{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.from small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.from b{display:block;font-size:15px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:13px 4px;border:0;background:none;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:#fff}
#tb{flex:1;overflow-y:auto;padding:10px}
.qi{display:flex;align-items:center;gap:10px;padding:7px;border-radius:10px;cursor:pointer}
.qi:hover{background:#0d1622}.qi.cur{background:rgba(0,120,255,.2)}.qi.done{opacity:.5}
.qi .im{width:76px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none;background:#000}
.qi img{width:100%;height:100%;object-fit:cover}.qi .art{font-size:20px}
.qi .tx{flex:1;min-width:0}.qi .t{font-size:13px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qi .a{font-size:12px;color:var(--muted)}.qx{border:0;background:none;font-size:18px;color:var(--muted)}
.lyr{white-space:pre-wrap;line-height:1.9;font-size:16px;padding:8px 10px}
.cm{padding:10px 8px;border-bottom:1px solid #111b29;font-size:13px;line-height:1.5}.cm b{font-size:12px;color:var(--neon)}
body.follow .ctl .nf,body.follow #seek{pointer-events:none;opacity:.5}
/* dialog */
#dlg{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
#dlg.open{display:flex}
.box{width:min(420px,100%);max-height:86vh;overflow-y:auto;border-radius:18px;border:1px solid #1d3045;background:#0b121c;padding:18px}
.box h3{margin:0 0 12px}.box .btn{display:block;width:100%;margin-top:8px;text-align:left;border-radius:12px}
.box input{width:100%;height:40px;margin-top:8px;border-radius:12px;border:1px solid #1c2c3e;background:#070c13;padding:0 12px}
.code{font-size:32px;font-weight:900;letter-spacing:6px;color:var(--neon);text-align:center;padding:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:400;max-width:90vw;padding:11px 16px;border-radius:12px;border:1px solid #1e3349;background:#0b1320;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* tv receiver */
body.tv #top,body.tv #side,body.tv #main,body.tv #mini,body.tv .plh,body.tv .plr,body.tv .ctl,body.tv #seek,body.tv .tm{display:none!important}
body.tv .plb{display:block;padding:0}body.tv #pl{transform:none}body.tv .vbox{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
body.tv .pll{overflow:hidden}body.tv .pll h2,body.tv .pll .mut{display:none}
@media(max-width:900px){
 #side{transform:translateX(-100%);width:260px;box-shadow:10px 0 40px #000}body.menu #side{transform:none}
 #main{left:0;padding:14px 12px 120px}#mini{left:0}
 .brand span{display:none}.plb{grid-template-columns:1fr;overflow-y:auto;display:block;padding:0 0 18px}
 .pll{overflow:visible;padding:0 14px}.plr{margin:16px 12px 0;min-height:420px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}

/* ---------- advanced cyber media lab ---------- */
.tech-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.tech-card{grid-column:span 4;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(13,20,31,.96),rgba(6,10,17,.96));padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.18)}.tech-card.wide{grid-column:span 8}.tech-card.full{grid-column:1/-1}.tech-card h3{margin:0 0 8px;font-size:15px}.tech-card p{margin:5px 0 10px;color:var(--muted);font-size:12px;line-height:1.55}.tech-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tech-row .btn{height:34px}.tech-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tech-stat div{padding:10px;border:1px solid #182638;border-radius:10px;background:#07101a}.tech-stat b{display:block;font-size:16px}.tech-stat span{font-size:10px;color:var(--muted)}.eq{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.eq label{font-size:10px;color:var(--muted);text-align:center}.eq input{width:100%;accent-color:var(--neon)}.eq input[type=range]{writing-mode:vertical-lr;direction:rtl;height:100px;width:24px;display:block;margin:4px auto}.vizwrap{position:relative;height:230px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(0,234,255,.12),transparent 55%),#02050a;border:1px solid #122238}.threeStage{position:absolute;inset:0;display:none}.threeStage.on{display:block}.threeStage canvas{width:100%!important;height:100%!important}.vizwrap canvas{width:100%;height:100%;display:block}.vizbadge{position:absolute;left:10px;top:10px;font-size:10px;padding:5px 8px;border:1px solid #1a3248;border-radius:20px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}.notes{display:grid;gap:7px;max-height:210px;overflow:auto}.note{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #172538;border-radius:10px}.note button{margin-left:auto}.dvr-list{display:grid;gap:8px;max-height:280px;overflow:auto}.dvr-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px;border:1px solid #172538;border-radius:10px}.dvr-item small{color:var(--muted)}.dvr-meter{height:9px;border-radius:9px;background:#08111b;overflow:hidden;border:1px solid #142236}.dvr-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--neon));transition:.3s}.mood-btn{padding:8px 10px;border-radius:10px;border:1px solid #1b2d42;background:#09121c;font-size:12px}.mood-btn:hover{border-color:var(--neon)}#visionVideo{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9;object-fit:cover}.vision-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#55606f}.vision-dot.on{background:#31ff91;box-shadow:0 0 12px #31ff91}.bull{position:fixed;right:18px;bottom:82px;z-index:180;width:88px;height:88px;border:1px solid rgba(0,234,255,.35);border-radius:28px;background:radial-gradient(circle at 50% 35%,rgba(0,234,255,.24),rgba(5,9,15,.92));box-shadow:0 0 30px rgba(0,180,255,.22);display:grid;place-items:center;cursor:pointer;animation:bullFloat 3s ease-in-out infinite}.bull svg{width:68px;height:68px;filter:drop-shadow(0 0 7px rgba(0,220,255,.6))}.bull .horn{fill:#d7e7ff}.bull .skin{fill:#6b7380}.bull .eye{fill:#00eaff}.bull:hover{transform:scale(1.05)}.bull.speaking{animation:bullTalk .18s ease-in-out infinite alternate}.bull-tip{position:absolute;right:0;bottom:96px;width:220px;padding:10px 12px;border:1px solid #1a3349;border-radius:14px;background:rgba(6,11,18,.95);font-size:11px;line-height:1.45;display:none}.bull:hover .bull-tip{display:block}@keyframes bullFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}@keyframes bullTalk{to{translate:0 -2px;scale:1.03}}.theme-cyber{--blue:#7b2cff;--blue2:#00eaff;--neon:#ff4dff}.theme-chill{--blue:#147d91;--blue2:#48d6c8;--neon:#a7fff3}.theme-fire{--blue:#ff5b00;--blue2:#ffc400;--neon:#ffe36b}.theme-focus{--blue:#2367d1;--blue2:#56a3ff;--neon:#8fc7ff}.glow-bg{position:fixed;inset:64px 0 0 240px;z-index:-1;pointer-events:none;background:radial-gradient(circle at 65% 35%,color-mix(in srgb,var(--neon) 11%,transparent),transparent 42%);filter:blur(20px)}
@media(max-width:900px){.tech-card,.tech-card.wide{grid-column:1/-1}.glow-bg{left:0}.bull{right:10px;bottom:76px;width:72px;height:72px}.bull svg{width:56px;height:56px}.eq{grid-template-columns:repeat(5,1fr)}}

</style>

<body>
<div class="glow-bg" id="glowBg"></div>
<div class="bull" id="bull" onclick="bullTalk()" aria-label="Cyber Bull assistant">
 <svg viewBox="0 0 100 100" aria-hidden="true"><path class="horn" d="M20 32Q4 18 8 5Q25 11 31 27M80 32Q96 18 92 5Q75 11 69 27"/><path class="skin" d="M23 30Q50 14 77 30V69Q70 90 50 94Q30 90 23 69Z"/><path class="skin" d="M18 49Q10 44 12 34Q21 33 27 43M82 49Q90 44 88 34Q79 33 73 43"/><circle class="eye" cx="37" cy="48" r="4"/><circle class="eye" cx="63" cy="48" r="4"/><path d="M36 67Q50 77 64 67" fill="none" stroke="#dce8ff" stroke-width="4" stroke-linecap="round"/><circle cx="43" cy="65" r="2" fill="#0a1018"/><circle cx="57" cy="65" r="2" fill="#0a1018"/></svg>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumb=id=>"https://i.ytimg.com/vi/"+encodeURIComponent(id)+"/hqdefault.jpg";
const mk=v=>({videoId:v.videoId,title:v.title||"Untitled",artist:v.artist||v.channel||"",duration:v.duration||"",thumbnail:v.thumbnail||thumb(v.videoId)});
const KEY="stxy_v1";
let D={liked:[],lists:{}};
try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
/* one-time import: favorites from the old vault become Liked Music */

function initVisualizer(){const c=$("viz");if(!c)return;const ctx=c.getContext("2d");const resize=()=>{c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)};resize();addEventListener("resize",resize);const draw=()=>{if(!c.isConnected)return;const w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);let data=new Uint8Array(TECH.analyser?TECH.analyser.frequencyBinCount:128);if(TECH.analyser)TECH.analyser.getByteFrequencyData(data);else for(let i=0;i<data.length;i++)data[i]=20+Math.sin(performance.now()/300+i)*12;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--neon")||"#00eaff";ctx.fillStyle="rgba(0,234,255,.18)";if(vMode==="wave"){ctx.beginPath();for(let i=0;i<data.length;i++){const x=i/(data.length-1)*w,y=h/2+(data[i]-128)*.8;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.stroke()}else if(vMode==="circle"){const r=Math.min(w,h)*.25;for(let i=0;i<data.length;i+=2){const a=i/data.length*Math.PI*2,rr=r+data[i]*.45;ctx.beginPath();ctx.arc(w/2+Math.cos(a)*rr,h/2+Math.sin(a)*rr,2.2,0,Math.PI*2);ctx.fill()}}else{const bw=w/data.length;for(let i=0;i<data.length;i++){const bh=data[i]/255*h*.85;ctx.fillRect(i*bw,h-bh,Math.max(1,bw-1),bh)}}requestAnimationFrame(draw)};draw();}

let visionStream=null,lastGesture=0,lastHandX=null;async function startVision(){const v=$("visionVideo");if(!v)return;try{visionStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:360},audio:false});v.srcObject=visionStream;$("visionDot").classList.add("on");toast("Camera started");loadHands()}catch(e){toast("Camera permission denied")}}
function stopVision(){if(visionStream)visionStream.getTracks().forEach(t=>t.stop());visionStream=null;const v=$("visionVideo");if(v)v.srcObject=null;$("visionDot")?.classList.remove("on")}
async function loadHands(){if(TECH.vision||!visionStream)return;try{if(!window.Hands){await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});}if(!window.Camera||!window.Hands){const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js";await new Promise((ok,no)=>{s.onload=ok;s.onerror=no;document.head.appendChild(s)})}const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.65,minTrackingConfidence:.55});hands.onResults(r=>{const lm=r.multiHandLandmarks?.[0];if(!lm)return;const x=lm[9].x;const palm=Math.abs(lm[8].y-lm[5].y)<.07&&Math.abs(lm[12].y-lm[9].y)<.08;if(palm&&Date.now()-lastGesture>1500){lastGesture=Date.now();togglePlay();return}if(lastHandX!==null){const dx=x-lastHandX;if(Math.abs(dx)>.22&&Date.now()-lastGesture>1200){lastGesture=Date.now();dx<0?next(false):prev()}}lastHandX=x});const cam=new Camera($("visionVideo"),{onFrame:async()=>hands.send({image:$("visionVideo")}),width:640,height:360});cam.start();TECH.vision={hands,cam}}catch(e){toast("Gesture engine unavailable — camera still active")}}
async function startPresence(){try{if(!window.webgazer){await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://webgazer.cs.brown.edu/webgazer.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}if(!window.webgazer)return;window.webgazer.setGazeListener((data)=>{if(!data||data.x==null)return;const away=data.x<0||data.y<0||data.x>innerWidth||data.y>innerHeight;if(away&&!document.hidden&&!userPaused&&Q.length){if(!TECH.webgazer){TECH.webgazer=true;togglePlay();const e=$("presenceState");if(e)e.textContent="Away detected · playback paused"}}else if(!away&&TECH.webgazer){TECH.webgazer=false;if(Q.length&&follow===false){togglePlay();const e=$("presenceState");if(e)e.textContent="Back in view · playback resumed"}}}).begin();const e=$("presenceState");if(e)e.textContent="Eye tracking active"}catch(e){toast("Presence tracking unavailable")}}
function bullTalk(){const msgs=["Samurai sync ready.","Tap Tech Lab for the cyber controls.","I keep the DVR audio-first and trim the oldest storage.","Room QR is one tap away."];toast(msgs[Math.random()*msgs.length|0]);$("bull").classList.add("speaking");setTimeout(()=>$("bull").classList.remove("speaking"),900)}
/* apply ambient glow + accent from current thumbnail without storing pixels */
function syncArtwork(it){if(!it?.thumbnail)return;const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{try{const c=document.createElement("canvas"),x=c.getContext("2d");c.width=c.height=1;x.drawImage(im,0,0,1,1);const d=x.getImageData(0,0,1,1).data;const r=d[0],g=d[1],b=d[2];document.documentElement.style.setProperty("--blue",`rgb(${r},${g},${b})`);document.documentElement.style.setProperty("--blue2",`rgb(${Math.min(255,r+30)},${Math.min(255,g+40)},${Math.min(255,b+55)})`);document.documentElement.style.setProperty("--neon",`rgb(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)})`)}catch(e){}};im.src=it.thumbnail}
const _loadCur=loadCur;loadCur=function(start){_loadCur(start);setTimeout(()=>{syncArtwork(Q[qi]);if(view==="tech")renderNotes()},80)};

/* ---------- init ---------- */
function resize(){$("menuBtn").style.display=innerWidth<=900?"grid":"none"}
addEventListener("resize",resize);resize();
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("dlg").classList.contains("open"))closeDlg();else if($("pl").classList.contains("open"))minPl()}});
load();paint();
const rm=/#room=([A-Z0-9]{8})/.exec(location.hash);if(rm){enterRoom(rm[1],false);toast("Joined room "+rm[1])}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{}));
</script>
