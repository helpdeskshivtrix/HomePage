<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030407">
<meta name="description" content="ShivTrixYouTube - music player">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShivTrixYouTube">
<title>ShivTrixYouTube</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#030407;--panel:#0b0f17;--panel2:#101620;--line:#1b2635;--blue:#0066ff;--blue2:#00a8ff;--neon:#00eaff;--text:#f4f7fb;--muted:#8e9bad;--red:#ff4268}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.mut{color:var(--muted)}
.btn{height:38px;padding:0 14px;border-radius:19px;border:1px solid #1e2c3f;background:#0b111a;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#28527b}.btn.pri{border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;font-size:18px;display:grid;place-items:center}
.ib:hover{background:#101a28}.ib.on{color:var(--neon)}.ib.big{width:54px;height:54px;background:#fff;color:#000;font-size:22px}
.ib.liked{color:var(--red)}
/* top bar */
#top{position:fixed;inset:0 0 auto 0;height:64px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(3,4,7,.92);backdrop-filter:blur(16px);border-bottom:1px solid #0e1622}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;letter-spacing:-.5px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#0055ff,#00d9ff);box-shadow:0 0 16px rgba(0,170,255,.45);font-size:13px}
.brand b{color:var(--neon)}
#q{flex:1;max-width:560px;margin:0 auto;height:42px;border-radius:21px;border:1px solid #1b2a3e;background:#0a0f17;padding:0 18px;outline:none}
#q:focus{border-color:rgba(0,234,255,.55)}
/* sidebar */
#side{position:fixed;top:64px;bottom:0;left:0;width:240px;z-index:40;padding:10px 12px 90px;overflow-y:auto;background:var(--bg);border-right:1px solid #0e1622;transition:transform .2s}
.nv{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:none;text-align:left;font-weight:700;font-size:14px;color:#c9d4e2}
.nv:hover{background:#0d1622}.nv.on{background:#13243b;color:#fff}
.nv small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.sh{padding:16px 14px 6px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:10px 4px}
#main{position:absolute;top:64px;bottom:0;left:240px;right:0;overflow-y:auto;padding:16px 22px 120px}
/* pills */
.slide{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.pills{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:9px;border:1px solid #1a293b;background:#0b121c;font-size:13px;font-weight:700;color:#c3cfdf}
.pill.on{background:#fff;color:#000;border-color:#fff}
.ar{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #1a293b;background:#0b121c}
h1.vt{font-size:26px;margin:4px 0 14px;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.cd{position:relative;cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#05070a}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.art{width:100%;height:100%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#0a3a8a,#04122e)}
.du{position:absolute;right:6px;bottom:6px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.8);font-size:11px;font-weight:800}
.ca{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px}
.ca button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px}
.ca button:hover{background:rgba(0,120,255,.9)}.ca .liked{color:var(--red)}
@media(hover:hover){.ca{opacity:0;transition:.15s}.cd:hover .ca{opacity:1}}
.ct{margin-top:8px;font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:12px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{height:84px;border-radius:12px;border:0;font-weight:800;font-size:16px;text-align:left;padding:14px;background:linear-gradient(135deg,#0b3d91,#06142f)}
.tile:hover{background:linear-gradient(135deg,var(--blue),#06142f)}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--muted)}
.spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid #17314d;border-top-color:var(--neon);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* mini bar */
#mini{display:none;position:fixed;left:240px;right:0;bottom:0;z-index:60;height:68px;align-items:center;gap:10px;padding:0 14px;background:#0b1320;border-top:1px solid var(--line)}
body.mini #mini{display:flex}
#mini img{width:88px;height:50px;object-fit:cover;border-radius:8px;background:#000;flex:none}
#mini .tx{flex:1;min-width:0;cursor:pointer}
#mini .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* player overlay */
#pl{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#06101f,#030407 60%);transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#pl.open{transform:none}
.plh{height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;flex:none}
.plh b{flex:1;font-size:16px}
.plb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;padding:0 22px 18px}
.pll{overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.vbox{position:relative;width:min(100%,760px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
#ytp,#ytp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.oart,#au{display:none}
.vbox.offl #ytp{display:none}.vbox.offl .oart{display:grid;position:absolute;inset:0;place-items:center;font-size:80px;background:linear-gradient(135deg,#0a3a8a,#04122e)}
.vbox.offl #au{display:block;position:absolute;left:0;right:0;bottom:0;width:100%;z-index:2}
.pll h2{width:min(100%,760px);margin:16px 0 2px;font-size:20px}
.pll .mut{width:min(100%,760px);font-weight:700}
#seek{width:min(100%,760px);margin-top:14px;accent-color:var(--blue2)}
.tm{width:min(100%,760px);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.plr{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:16px;background:rgba(11,15,23,.8)}
.from{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.from small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.from b{display:block;font-size:15px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:13px 4px;border:0;background:none;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:#fff}
#tb{flex:1;overflow-y:auto;padding:10px}
.qi{display:flex;align-items:center;gap:10px;padding:7px;border-radius:10px;cursor:pointer}
.qi:hover{background:#0d1622}.qi.cur{background:rgba(0,120,255,.2)}.qi.done{opacity:.5}
.qi .im{width:76px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none;background:#000}
.qi img{width:100%;height:100%;object-fit:cover}.qi .art{font-size:20px}
.qi .tx{flex:1;min-width:0}.qi .t{font-size:13px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qi .a{font-size:12px;color:var(--muted)}.qx{border:0;background:none;font-size:18px;color:var(--muted)}
.lyr{white-space:pre-wrap;line-height:1.9;font-size:16px;padding:8px 10px}.lyLine{padding:3px 0;color:var(--muted);transition:.2s}.lyLine.active{color:var(--neon);font-weight:900;text-shadow:0 0 12px rgba(0,234,255,.4);transform:scale(1.02)}
.cm{padding:10px 8px;border-bottom:1px solid #111b29;font-size:13px;line-height:1.5}.cm b{font-size:12px;color:var(--neon)}
body.follow .ctl .nf,body.follow #seek{pointer-events:none;opacity:.5}
/* dialog */
#dlg{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
#dlg.open{display:flex}
.box{width:min(420px,100%);max-height:86vh;overflow-y:auto;border-radius:18px;border:1px solid #1d3045;background:#0b121c;padding:18px}
.box h3{margin:0 0 12px}.box .btn{display:block;width:100%;margin-top:8px;text-align:left;border-radius:12px}
.box input{width:100%;height:40px;margin-top:8px;border-radius:12px;border:1px solid #1c2c3e;background:#070c13;padding:0 12px}
.code{font-size:32px;font-weight:900;letter-spacing:6px;color:var(--neon);text-align:center;padding:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:400;max-width:90vw;padding:11px 16px;border-radius:12px;border:1px solid #1e3349;background:#0b1320;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#cyberViz{position:fixed;inset:0;z-index:500;display:none;background:#010308}
#cyberViz.open{display:block}.vizFull{position:absolute;inset:0}.vizFull canvas{position:absolute;inset:0;width:100%;height:100%}.vizFullTop{position:absolute;top:0;left:0;right:0;padding:18px;display:flex;justify-content:space-between;align-items:center;color:var(--neon);letter-spacing:.12em}.vizModes{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
/* tv receiver */
body.tv #top,body.tv #side,body.tv #main,body.tv #mini,body.tv .plh,body.tv .plr,body.tv .ctl,body.tv #seek,body.tv .tm{display:none!important}
body.tv .plb{display:block;padding:0}body.tv #pl{transform:none}body.tv .vbox{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
body.tv .pll{overflow:hidden}body.tv .pll h2,body.tv .pll .mut{display:none}
@media(max-width:900px){
 #side{transform:translateX(-100%);width:260px;box-shadow:10px 0 40px #000}body.menu #side{transform:none}
 #main{left:0;padding:14px 12px 120px}#mini{left:0}
 .brand span{display:none}.plb{grid-template-columns:1fr;overflow-y:auto;display:block;padding:0 0 18px}
 .pll{overflow:visible;padding:0 14px}.plr{margin:16px 12px 0;min-height:420px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}

/* ---------- precision room sync + QR ---------- */
.qrbox{display:grid;place-items:center;padding:12px 0}
.qrbox img{width:min(280px,72vw);aspect-ratio:1;border-radius:16px;background:#fff;padding:10px;image-rendering:auto}
.roomcode{font-size:34px;font-weight:950;letter-spacing:7px;color:var(--neon);text-align:center;padding:6px 0 2px;text-shadow:0 0 18px rgba(0,234,255,.35)}
.roommeta{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.roomdot{width:8px;height:8px;border-radius:50%;background:#35ff9b;box-shadow:0 0 12px #35ff9b}
.scanbox{position:relative;overflow:hidden;border-radius:16px;border:1px solid #21405c;background:#02060b;aspect-ratio:1;display:grid;place-items:center}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:14%;border:2px solid var(--neon);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.25),0 0 28px rgba(0,234,255,.35)}
.scanframe:after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--neon);box-shadow:0 0 14px var(--neon);animation:scanline 1.5s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(-95px);opacity:.35}50%{transform:translateY(95px);opacity:1}}
.syncbadge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #1c3b52;border-radius:999px;background:#07121d;color:#8fefff;font-size:10px;font-weight:900;letter-spacing:.08em}
.syncbadge .roomdot{width:6px;height:6px}

/* ---------- Cyber Media Center add-ons ---------- */
:root{--glass:rgba(12,20,32,.72);--glow:0 0 24px rgba(0,234,255,.14)}
body.light{--bg:#eef4fb;--panel:#fff;--panel2:#f4f8fc;--line:#cbd8e6;--text:#0a1220;--muted:#53657a}
body.light #top,body.light #side,body.light #mini{background:rgba(244,248,252,.92);color:var(--text)}
body.light .nv,body.light .pill,body.light .btn,body.light .ar{color:#203047;background:#fff;border-color:#cbd8e6}
body.light #q,.light .box,.light .plr{background:#fff;color:#0a1220}
#viz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.72;mix-blend-mode:screen}
#vizHud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;pointer-events:none;font-size:9px;letter-spacing:.14em;font-weight:900;color:#8eefff;text-shadow:0 0 10px #00eaff}
#vizHud b{color:#fff}
body.focus #top,body.focus #side,body.focus #mini,body.focus .plh,body.focus .plr,body.focus .ctl,body.focus #seek,body.focus .tm,body.focus .pll h2,body.focus .pll>.mut{display:none!important}
body.focus #pl{transform:none}
body.focus .plb{display:block;padding:0}
body.focus .pll{height:100%;justify-content:center;padding:18px}
body.focus .vbox{width:min(1100px,94vw);max-height:78vh;aspect-ratio:16/9;box-shadow:0 0 80px rgba(0,160,255,.18)}
.techGrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.techCard{grid-column:span 4;border:1px solid var(--line);background:linear-gradient(145deg,rgba(14,24,39,.95),rgba(7,12,20,.9));border-radius:16px;padding:16px;box-shadow:var(--glow)}
.techCard.wide{grid-column:span 8}.techCard.full{grid-column:1/-1}
.techCard h3{margin:0 0 6px;font-size:14px}.techCard p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.5}
.metric{font-size:28px;font-weight:950;color:var(--neon);margin:8px 0}.meter{height:7px;border-radius:99px;background:#101b29;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--neon));box-shadow:0 0 12px var(--neon)}
.techBtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.techBtns .btn{height:34px}
.eqgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;align-items:end;height:170px}.eqband{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;font-size:9px;color:var(--muted)}.eqband input{writing-mode:vertical-lr;direction:rtl;height:130px;accent-color:var(--neon)}
.searchTabs{display:flex;gap:6px;margin:10px 0;border-bottom:1px solid var(--line);overflow:auto}.searchTabs button{border:0;background:none;color:var(--muted);padding:10px;font-weight:800;white-space:nowrap}.searchTabs button.on{color:var(--neon);border-bottom:2px solid var(--neon)}
.scanLine{display:flex;gap:8px}.scanLine input{flex:1}.queueDrop{outline:1px dashed transparent}.queueDrop.dragover{outline-color:var(--neon);background:rgba(0,234,255,.08)}
#scanVideo{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:1}
.qrbox{display:grid;place-items:center;padding:10px;border-radius:16px;background:#fff;margin:8px auto;width:240px}.qrbox img{width:220px;height:220px;display:block}
@media(max-width:900px){.techCard,.techCard.wide{grid-column:1/-1}.eqgrid{gap:4px}}
</style>
</head>
<body>

<header id="top">
 <button class="ib" id="menuBtn" onclick="document.body.classList.toggle('menu')" style="display:none">☰</button>
 <div class="brand"><div class="logo">▶</div><span>ShivTrix<b>YouTube</b></span></div>
 <input id="q" type="search" placeholder="Search songs, artists, albums" autocomplete="off">
 <button class="ib" id="castBtn" onclick="showCast()" title="Cast to device">📡</button>
</header>

<nav id="side">
 <button class="nv" data-v="home" onclick="go('home')">⌂ Home</button>
 <button class="nv" data-v="explore" onclick="go('explore')">◎ Explore</button>
 <div class="sep"></div>
 <div class="sh">LIBRARY</div>
 <button class="nv" data-v="offline" onclick="go('offline')">⬇<span>Offline library<small>Songs from device storage</small></span></button>
 <button class="nv" data-v="liked" onclick="go('liked')">♥ Liked Music</button>
 <div class="sep"></div>
 <div class="sh">TECH CENTER</div>
 <button class="nv" data-v="tech" onclick="go('tech')">⚡ <span>Cyber Tech Center<small>Visualizer · EQ · Analytics</small></span></button>
 <button class="nv" data-v="search" onclick="openSearchHub()">⌕ Advanced Search</button>
 <button class="nv" data-v="network" onclick="openNetworkHub()">◉ Network Monitor</button>
 <div class="sep"></div>
 <div class="sh">PLAYLISTS</div>
 <button class="nv" onclick="newList()">＋ New playlist</button>
 <div id="pls"></div>
</nav>

<main id="main"></main>

<div id="mini">
 <img id="mImg" alt="">
 <div class="tx" onclick="openPl()"><div id="mT" style="font-weight:700;font-size:14px"></div><div id="mA" class="mut" style="font-size:12px"></div></div>
 <button class="ib" onclick="prev()">⏮</button>
 <button class="ib big" id="mPP" onclick="togglePlay()" style="width:44px;height:44px;font-size:18px">⏸</button>
 <button class="ib" onclick="next(false)">⏭</button>
 <button class="ib" onclick="closePl()">✕</button>
</div>

<div id="pl">
 <div class="plh">
  <button class="ib" onclick="minPl()" title="Minimize">⌄</button>
  <b>ShivTrixYouTube</b>
  <button class="ib" onclick="showCast()" title="Cast to device">📡</button>
 </div>
 <div class="plb">
  <div class="pll">
   <div class="vbox" id="vbox"><div id="ytp"></div><div class="oart">♪</div><audio id="au" controls></audio><canvas id="viz" aria-hidden="true"></canvas><div id="vizHud"><span>CYBER VISUALIZER</span><b id="vizMode">SPECTRUM</b></div></div>
   <h2 id="plT">Nothing playing</h2>
   <div class="mut" id="plA"></div>
   <input id="seek" type="range" min="0" max="1000" value="0">
   <div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
   <div class="ctl">
    <button class="ib" id="bSh" onclick="togShuf()" title="Shuffle">⇄</button>
    <button class="ib nf" onclick="prev()">⏮</button>
    <button class="ib big" id="bPP" onclick="togglePlay()">⏸</button>
    <button class="ib nf" onclick="next(false)">⏭</button>
    <button class="ib" id="bRp" onclick="cycRep()" title="Repeat">↻</button>
    <button class="ib" id="bLk" onclick="likeCur()" title="Like">♡</button>
   </div>
  </div>
  <div class="plr">
   <div class="from">
    <div><small>Playing from</small><b id="plF"></b></div>
    <button class="btn pri" onclick="savePick(Q[qi])">＋ Save</button>
   </div>
   <div class="tabs" id="tabs">
    <button data-t="up" class="on" onclick="tab('up')">UP NEXT</button>
    <button data-t="ly" onclick="tab('ly')">LYRICS</button>
    <button data-t="cm" onclick="tab('cm')">COMMENTS</button>
    <button data-t="rl" onclick="tab('rl')">RELATED</button>
   </div>
   <div id="tb"></div>
  </div>
 </div>
</div>

<div id="dlg" onclick="if(event.target.id==='dlg')closeDlg()"><div class="box" id="dbox"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumb=id=>"https://i.ytimg.com/vi/"+encodeURIComponent(id)+"/hqdefault.jpg";
const mk=v=>({videoId:v.videoId,title:v.title||"Untitled",artist:v.artist||v.channel||"",duration:v.duration||"",thumbnail:v.thumbnail||thumb(v.videoId)});
const KEY="stxy_v1";
let D={liked:[],lists:{}};
try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
/* one-time import: favorites from the old vault become Liked Music */
try{if(!localStorage.getItem("stxy_mig")){
 JSON.parse(localStorage.getItem("shivtrix_videovault_v1")||"[]").forEach(v=>{
  if(v.videoId&&v.favorite&&!D.liked.some(x=>x.videoId===v.videoId))D.liked.push(mk(v))});
 localStorage.setItem("stxy_mig","1");save()}}catch(e){}
let toastT;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}
function dlg(h){$("dbox").innerHTML=h;$("dlg").classList.add("open")}
function closeDlg(){$("dlg").classList.remove("open")}

/* ---------- network (public Piped / Invidious servers + lrclib) ---------- */
const PIPED=["https://pipedapi.kavin.rocks","https://pipedapi.adminforge.de","https://api.piped.private.coffee"];
const INV=["https://inv.nadeko.net","https://yewtu.be","https://invidious.nerdvpn.de"];
async function j(u,t=7000){const c=new AbortController(),x=setTimeout(()=>c.abort(),t);
 try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(x)}}
async function any(fns){for(const f of fns){try{const r=await f();if(r&&r.length)return r}catch(e){}}return null}
const sec=n=>{n=Math.round(+n);if(!n||n<0)return"";const h=n/3600|0,m=n%3600/60|0,s=n%60,p=x=>String(x).padStart(2,0);return h?`${h}:${p(m)}:${p(s)}`:`${m}:${p(s)}`};
const vid=u=>new URLSearchParams((u||"").split("?")[1]).get("v");
const isW=i=>/watch\?v=/.test(i.url||"");
const pn=i=>({videoId:vid(i.url),title:i.title,artist:i.uploaderName||"",duration:sec(i.duration)});
const iv=i=>({videoId:i.videoId,title:i.title,artist:i.author||"",duration:sec(i.lengthSeconds)});
const fin=a=>(a||[]).filter(x=>x.videoId).map(mk);
const plain=h=>new DOMParser().parseFromString(h||"","text/html").body.textContent;
const search=async q=>fin(await any([
 ...PIPED.map(b=>async()=>(await j(`${b}/search?q=${encodeURIComponent(q)}&filter=videos`)).items.filter(isW).map(pn)),
 ...INV.map(b=>async()=>(await j(`${b}/api/v1/search?q=${encodeURIComponent(q)}&type=video`)).filter(i=>i.type==="video").map(iv))]));
const related=async id=>fin(await any([
 ...PIPED.map(b=>async()=>(await j(`${b}/streams/${id}`)).relatedStreams.filter(isW).map(pn)),
 ...INV.map(b=>async()=>(await j(`${b}/api/v1/videos/${id}`)).recommendedVideos.map(iv))]));
const comments=async id=>await any([
 ...PIPED.map(b=>async()=>(await j(`${b}/comments/${id}`)).comments.map(c=>({a:c.author,t:plain(c.commentText),l:c.likeCount,d:c.commentedTime}))),
 ...INV.map(b=>async()=>(await j(`${b}/api/v1/comments/${id}`)).comments.map(c=>({a:c.author,t:plain(c.content),l:c.likeCount,d:c.publishedText})))])||[];
async function lyrics(it){
 const t=it.title.replace(/[\(\[].*?[\)\]]/g,"").replace(/official|video|audio|lyrics?|hd/gi,"").trim();
 const r=await j("https://lrclib.net/api/search?q="+encodeURIComponent(t+" "+it.artist.replace(/ - Topic$/,"")),9000);
 const h=r.find(x=>x.syncedLyrics||x.plainLyrics);return h?{plain:h.plainLyrics||"",synced:h.syncedLyrics||""}:null}

/* ---------- offline library (device files kept in IndexedDB) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("stxy",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=no});
async function offAll(){const d=await idb();return new Promise(ok=>{const r=d.transaction("f").objectStore("f").getAll();r.onsuccess=()=>ok(r.result.map(f=>({off:true,id:f.id,videoId:"off"+f.id,title:f.name,artist:"Device storage",duration:"",thumbnail:"",url:URL.createObjectURL(f.blob)})))})}
async function offAdd(files){const d=await idb(),t=d.transaction("f","readwrite");
 [...files].forEach(f=>t.objectStore("f").add({name:f.name.replace(/\.[^.]+$/,""),blob:f}));
 await new Promise(ok=>t.oncomplete=ok);toast(files.length+" song(s) added");go("offline")}
async function offDel(i){const it=LIST[i];if(!it||!confirm("Remove from offline library?\n"+it.title))return;
 const d=await idb(),t=d.transaction("f","readwrite");t.objectStore("f").delete(it.id);await new Promise(ok=>t.oncomplete=ok);go("offline")}

/* ---------- views ---------- */
const PILLS=[["All",""],["Familiar","FAM"],["Popular","top hits"],["Discover","new music"],["Deep cuts","hidden gems underrated"],["Romance","romantic songs"],["Energize","energetic workout"],["Relax","chill relax"],["Focus","focus study lo-fi"],["Party","party hits"]];
const GENRES=["Rock","Rap","Trap","EDM","Phonk","Lo-Fi","Pop","Bollywood","Punjabi","Romance","Workout","Night Drive"];
let view="home",pill=0,qry="",res=[],loading=false,rid=0,LIST=[],SRC="";
const names=()=>Object.keys(D.lists);
const isLiked=id=>D.liked.some(x=>x.videoId===id);
const pillsH=(act,fn)=>`<div class="slide"><button class="ar" onclick="sl(this,-1)">‹</button><div class="pills">${PILLS.map((p,i)=>`<button class="pill ${i===act?"on":""}" onclick="${fn}(${i})">${p[0]}</button>`).join("")}</div><button class="ar" onclick="sl(this,1)">›</button></div>`;
function sl(b,d){const p=b.parentNode.querySelector(".pills");p.scrollLeft+=d*240}
function go(v){view=v;document.body.classList.remove("menu");if(v==="home")load();paint()}
function pickPill(i){pill=i;load()}
function homeQuery(){const m=PILLS[pill][1];
 if(m==="FAM"){const a=D.liked.length?D.liked[Math.random()*D.liked.length|0].artist:"";return a?a+" songs":"top music hits"}
 return qry?(qry+" "+m).trim():(m||"top music hits")}
async function load(){const my=++rid;loading=true;paint();const r=await search(homeQuery());if(my!==rid)return;res=r;loading=false;paint()}
function card(it,i){
 const li=isLiked(it.videoId);
 return `<div class="cd"><div class="th" onclick="playAt(${i})">${it.thumbnail?`<img src="${esc(it.thumbnail)}" loading="lazy" alt="" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(it.videoId)}/mqdefault.jpg'">`:'<div class="art">♪</div>'}${it.duration?`<div class="du">${esc(it.duration)}</div>`:""}
 <div class="ca" onclick="event.stopPropagation()"><button class="${li?"liked":""}" title="Like" onclick="likeI(${i})">${li?"♥":"♡"}</button><button title="Play next" onclick="qAdd(${i},true)">⏭</button><button title="Save to playlist" onclick="savePick(LIST[${i}])">＋</button>${it.off?`<button title="Remove" onclick="offDel(${i})">🗑</button>`:""}</div></div>
 <div class="ct" onclick="playAt(${i})">${esc(it.title)}</div><div class="cs">${esc(it.artist)}</div></div>`}
const gridH=(items,msg)=>items.length?`<div class="grid">${items.map(card).join("")}</div>`:`<div class="grid"><div class="empty">${msg}</div></div>`;
async function paint(){
 document.querySelectorAll("#side .nv[data-v]").forEach(e=>e.classList.toggle("on",e.dataset.v===view));
 $("pls").innerHTML=names().map((n,i)=>`<button class="nv ${view==="l"+i?"on":""}" onclick="go('l${i}')">☰ ${esc(n)}</button>`).join("");
 const m=$("main");
 if(view==="home"){
  LIST=res;SRC=qry?"“"+qry+"” mix":(PILLS[pill][0]==="All"?"ShivTrix Mix":PILLS[pill][0]+" Mix");
  m.innerHTML=pillsH(pill,"pickPill")+(loading?'<div class="grid"><div class="empty"><div class="spin"></div>Loading music…</div></div>':gridH(res,"Couldn’t load music. The free public servers may be busy — try again or search above."));
 }else if(view==="explore"){
  m.innerHTML=`<h1 class="vt">Explore</h1><div class="tiles">${GENRES.map(g=>`<button class="tile" onclick="qry='${g} music';pill=0;$('q').value=qry;go('home')">${g}</button>`).join("")}</div>`;
 }else if(view==="offline"){
  LIST=await offAll();SRC="Offline library";
  m.innerHTML=`<h1 class="vt">Offline library</h1><p class="mut" style="margin:-6px 0 14px">Songs from device storage</p><label class="btn pri" style="display:inline-flex;align-items:center;margin-bottom:16px">＋ Add songs from device<input type="file" accept="audio/*" multiple hidden onchange="offAdd(this.files)"></label>`+gridH(LIST,"No songs yet. Add audio files from your device.");
 }else if(view==="liked"){
  LIST=D.liked;SRC="Liked Music";
  m.innerHTML=`<h1 class="vt">Liked Music</h1>`+gridH(LIST,"Songs you like will show up here.");
 }else if(view==="tech"){
  LIST=[];SRC="Cyber Media Center";m.innerHTML=techHTML();initNetMini();
 }else if(view[0]==="l"){
  const n=names()[+view.slice(1)];if(n===undefined){go("home");return}
  LIST=D.lists[n];SRC=n;
  m.innerHTML=`<h1 class="vt">${esc(n)}</h1><div style="margin-bottom:16px;display:flex;gap:8px"><button class="btn pri" onclick="playAt(0)">▶ Play all</button><button class="btn" onclick="delList('${view.slice(1)}')">Delete playlist</button></div>`+gridH(LIST,"This playlist is empty. Use ＋ on any song to save it here.");
 }
}
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();qry=e.target.value.trim();pill=0;e.target.blur();view="home";load()}});

/* ---------- likes & playlists ---------- */
function likeItem(it){
 if(!it)return;const k=D.liked.findIndex(x=>x.videoId===it.videoId);
 if(k>=0){D.liked.splice(k,1);toast("Removed from Liked Music")}else{D.liked.unshift(mk(it));toast("Added to Liked Music")}
 save();paint();refreshLike()}
const likeI=i=>likeItem(LIST[i]);
const likeCur=()=>likeItem(Q[qi]&&!Q[qi].off?Q[qi]:null);
function newList(it){const n=(prompt("Playlist name")||"").trim();if(!n)return;
 if(!D.lists[n])D.lists[n]=[];if(it)addTo(n,it);save();paint()}
function addTo(n,it){if(!it||it.off)return toast("Offline songs can't be added to playlists");
 if(!D.lists[n].some(x=>x.videoId===it.videoId))D.lists[n].push(mk(it));save();closeDlg();toast("Saved to "+n);paint()}
let pendIt=null;
function savePick(it){if(!it)return;pendIt=it;
 dlg(`<h3>Save to playlist</h3>${names().map((n,i)=>`<button class="btn" onclick="addTo(names()[${i}],pendIt)">☰ ${esc(n)}</button>`).join("")}<button class="btn pri" onclick="closeDlg();newList(pendIt)">＋ New playlist</button>`)}
function delList(i){const n=names()[+i];if(n&&confirm("Delete playlist “"+n+"”?")){delete D.lists[n];save();go("home")}}

/* ---------- player ---------- */
let Q=[],qi=-1,from="",yt=null,ytReady=false,ytApi=null,pend=null,userPaused=false,errs=0,shuf=false,rep=0,rmod="",busy=false,drag=false,follow=false,up=null,curTab="up";
const au=$("au"),played=new Set();
function loadYT(){if(window.YT&&YT.Player)return Promise.resolve();
 return ytApi=ytApi||new Promise((ok,no)=>{window.onYouTubeIframeAPIReady=ok;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>{ytApi=null;no()};document.head.appendChild(s)})}
function ytLoad(id,t){loadYT().then(()=>{
 if(!yt){const v={autoplay:1,playsinline:1,rel:0,modestbranding:1,enablejsapi:1,start:Math.floor(t||0)};if(/^https?:$/.test(location.protocol))v.origin=location.origin;
  yt=new YT.Player("ytp",{width:"100%",height:"100%",videoId:id,playerVars:v,events:{onReady:()=>{ytReady=true;if(pend){yt.loadVideoById({videoId:pend.id,startSeconds:pend.t});pend=null}},onStateChange:onState,onError:onErr}})}
 else if(!ytReady)pend={id,t:t||0};else yt.loadVideoById({videoId:id,startSeconds:t||0})}).catch(()=>toast("Couldn't load the YouTube player"))}
function playAt(i){
 if(!LIST[i])return;
 if(room&&!roomLeader){const it=LIST[i];bc({t:"cmd",c:"load",it,from:SRC});toast("Sent to room leader");return}
 follow=false;document.body.classList.remove("follow");Q=LIST.slice();qi=i;from=SRC;played.clear();rmod="";openPl();loadCur()
}
function loadCur(start){
 const it=Q[qi];if(!it)return;played.add(it.videoId);userPaused=false;
 if(lastStatId!==it.videoId){lastStatId=it.videoId;statPlay(it)}
 statTick=Date.now();
 $("plT").textContent=it.title;$("plA").textContent=it.artist;$("plF").textContent=from;
 $("mT").textContent=it.title;$("mA").textContent=it.artist;$("mImg").src=it.thumbnail||"";
 $("vbox").classList.toggle("offl",!!it.off);
 cache={};tab(curTab);keepOn();media(it);refreshLike();
 if(it.off){if(yt&&ytReady)try{yt.pauseVideo()}catch(e){}au.src=it.url;au.play().catch(()=>{})}
 else{au.pause();ytLoad(it.videoId,start)}
 if(!follow){sendLoad();topUp()}}
function onState(e){const S=YT.PlayerState;
 if(e.data===S.PLAYING){userPaused=false;errs=0;ui(true);keepOn()}
 else if(e.data===S.PAUSED){ui(false);if(document.hidden&&!userPaused&&!follow)setTimeout(()=>{try{if(!userPaused&&yt.getPlayerState()===S.PAUSED)yt.playVideo()}catch(x){}},400);if(!document.hidden)userPaused=true}
 else if(e.data===S.ENDED)ended();
 if(!follow&&roomLeader)sendState()}
function onErr(){errs++;toast("Can't play this video. Skipping…");if(follow||errs>=Math.min(Q.length,5))return;setTimeout(()=>next(true),800)}
au.onplay=()=>ui(true);au.onpause=()=>ui(false);au.onended=()=>ended();
function ended(){if(follow)return;if(rep===2){seekTo(0);resume();return}next(true)}
function resume(){const it=Q[qi];if(it&&it.off)au.play();else try{yt.playVideo()}catch(e){}}
function time(){try{const it=Q[qi];return it&&it.off?au.currentTime:(yt&&ytReady?yt.getCurrentTime():0)||0}catch(e){return 0}}
function dur(){try{const it=Q[qi];return it&&it.off?au.duration||0:(yt&&ytReady?yt.getDuration():0)||0}catch(e){return 0}}
function seekTo(s){const it=Q[qi];if(it&&it.off)au.currentTime=s;else try{yt.seekTo(s,true)}catch(e){}}
function playing(){const it=Q[qi];if(it&&it.off)return!au.paused;try{const s=yt.getPlayerState();return s===1||s===3}catch(e){return false}}
function togglePlay(){if(follow&&room)return cmd("toggle");
 if(playing()){userPaused=true;const it=Q[qi];if(it&&it.off)au.pause();else yt.pauseVideo()}else{userPaused=false;resume()}}
function ui(p){$("bPP").textContent=p?"⏸":"▶";$("mPP").textContent=p?"⏸":"▶";try{navigator.mediaSession.playbackState=p?"playing":"paused"}catch(e){}}
function nextIdx(){if(!Q.length)return-1;
 if(shuf&&Q.length>1){let i;do{i=Math.random()*Q.length|0}while(i===qi);return i}
 if(qi+1<Q.length)return qi+1;return rep===1?0:-1}
async function next(auto){
 if(follow&&room)return cmd("next");
 if(nextIdx()===-1&&Q.length&&!(Q[qi]&&Q[qi].off)){toast("Finding related songs…");await topUp(true)}
 const i=nextIdx();if(i===-1){if(auto)ui(false);return}qi=i;loadCur()}
function prev(){if(follow&&room)return cmd("prev");
 if(time()>5){seekTo(0);return}if(!Q.length)return;qi=qi>0?qi-1:(rep===1?Q.length-1:0);loadCur()}
function jump(i){qi=i;loadCur()}
function togShuf(){shuf=!shuf;$("bSh").classList.toggle("on",shuf)}
function cycRep(){rep=(rep+1)%3;$("bRp").classList.toggle("on",rep>0);$("bRp").textContent=rep===2?"↻1":"↻"}
function refreshLike(){const it=Q[qi],l=it&&isLiked(it.videoId);$("bLk").textContent=l?"♥":"♡";$("bLk").classList.toggle("liked",!!l)}
function qAdd(i,nx){const it=LIST[i];if(!it)return;
 if(!Q.length){Q=[it];qi=0;from=SRC;openPl();loadCur();return}
 Q.splice(nx?qi+1:Q.length,0,it);renderTab();toast(nx?"Will play next":"Added to queue")}
function rmQ(i,e){e.stopPropagation();if(i===qi)return;Q.splice(i,1);if(i<qi)qi--;renderTab()}
/* radio: keeps the queue filled with related songs */
async function topUp(force){
 const cur=Q[qi];if(busy||!cur||cur.off)return;if(!force&&Q.length-1-qi>=3)return;
 busy=true;renderTab();
 try{let r=[];
  if(rmod)r=await search((cur.artist.replace(/ - Topic$/,"")+" "+rmod).trim());
  else{r=await related(cur.videoId);if(!r.length)r=await search(cur.artist+" songs")}
  const fresh=r.filter(x=>!played.has(x.videoId)&&!Q.some(q=>q.videoId===x.videoId)).slice(0,10);
  Q.push(...fresh)}catch(e){}
 busy=false;renderTab()}
function radioPill(i){rmod=PILLS[i][1]==="FAM"?"":PILLS[i][1];pillIdx=i;Q=Q.slice(0,qi+1);topUp(true)}
let pillIdx=0,cache={};
function queueDragStart(e,i){e.dataTransfer.setData("text/plain",String(i))}function queueDragOver(e){e.preventDefault();e.currentTarget.classList.add("dragover")}function queueDragLeave(e){e.currentTarget.classList.remove("dragover")}function queueDrop(e,to){e.preventDefault();e.currentTarget.classList.remove("dragover");const fromI=+e.dataTransfer.getData("text/plain");if(Number.isNaN(fromI)||fromI===to)return;const item=Q.splice(fromI,1)[0];let dest=to;if(fromI<to)dest--;Q.splice(dest,0,item);if(qi===fromI)qi=dest;else if(fromI<qi&&dest>=qi)qi--;else if(fromI>qi&&dest<=qi)qi++;renderTab();toast("Queue reordered")}
/* tabs */
function tab(t){curTab=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));renderTab()}
function qiH(q,i,cls,x){return `<div class="qi queueDrop ${cls}" draggable="true" ondragstart="queueDragStart(event,${i})" ondragover="queueDragOver(event)" ondragleave="queueDragLeave(event)" ondrop="queueDrop(event,${i})" onclick="${x[0]}"><div class="im">${q.thumbnail?`<img src="${esc(q.thumbnail)}" alt="" loading="lazy">`:'<div class="art">♪</div>'}</div><div class="tx"><div class="t">${esc(q.title)}</div><div class="a">${esc(q.artist)}</div></div>${x[1]||""}</div>`}
async function renderTab(){
 const b=$("tb"),it=Q[qi],t=curTab;if(!it){b.innerHTML="";return}
 if(t==="up"){
  b.innerHTML=pillsH(pillIdx,"radioPill")+Q.map((q,i)=>qiH(q,i,(i===qi?"cur":"")+(i<qi?" done":""),[`jump(${i})`,i===qi?'<span style="color:var(--neon)">▶</span>':`<button class="qx" onclick="rmQ(${i},event)">×</button>`])).join("")+(busy?'<div class="empty" style="padding:16px"><div class="spin"></div></div>':"");
  const c=b.querySelector(".cur");if(c)b.scrollTop=c.offsetTop-80;return}
 const id=it.videoId;
 if(it.off){b.innerHTML='<div class="empty">Not available for offline songs.</div>';return}
 if(cache[t]===undefined){b.innerHTML='<div class="empty"><div class="spin"></div></div>';
  let v;try{v=t==="ly"?await lyrics(it):t==="cm"?await comments(id):await related(id)}catch(e){v=null}
  if(!Q[qi]||Q[qi].videoId!==id)return;cache[t]=v}
 const v=cache[t];if(curTab!==t)return;
 if(t==="ly"){if(!v){b.innerHTML='<div class="empty">No lyrics found for this song.</div>'}else if(v.synced){window.syncedLines=parseLRC(v.synced);b.innerHTML=`<div class="lyr" id="syncedLyrics">${window.syncedLines.map((x,i)=>`<div class="lyLine" data-time="${x.t}" id="ly_${i}">${esc(x.text)}</div>`).join("")}</div>`}else b.innerHTML=`<div class="lyr">${esc(v.plain||"")}</div>`;}
 else if(t==="cm")b.innerHTML=v&&v.length?v.map(c=>`<div class="cm"><b>${esc(c.a)}</b> <span class="mut">${esc(c.d||"")}</span><div>${esc(c.t)}</div>${c.l?`<span class="mut">♥ ${esc(c.l)}</span>`:""}</div>`).join(""):'<div class="empty">Comments aren’t available right now.</div>';
 else{window.RL=v||[];b.innerHTML=RL.length?RL.map((q,i)=>qiH(q,i,"",[`playRel(${i})`,`<button class="qx" onclick="event.stopPropagation();relNext(${i})" title="Play next">⏭</button>`])).join(""):'<div class="empty">No related songs found.</div>'}}
function parseLRC(raw){return String(raw||"").split(/\r?\n/).flatMap(line=>{const out=[];const re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;let m,last=0;while((m=re.exec(line))){out.push({t:+m[1]*60 + +m[2],text:line.slice(re.lastIndex).trim()});last=re.lastIndex}return out}).filter(x=>x.text).sort((a,b)=>a.t-b.t)}

 if(!follow||!Q[qi]||Q[qi].videoId!==m.id||!yt||!ytReady)return;
 try{
   const target=predictedClock(m),now=yt.getCurrentTime(),diff=target-now;
   if(Math.abs(diff)>=HARD_SYNC){yt.seekTo(Math.max(0,target),true)}
   else if(Math.abs(diff)>=SOFT_SYNC&&yt.setPlaybackRate){
     yt.setPlaybackRate(diff>0?1.05:.95);
     clearTimeout(precisionApply._r);
     precisionApply._r=setTimeout(()=>{try{yt.setPlaybackRate(1)}catch(e){}},900);
   }else if(yt.setPlaybackRate)yt.setPlaybackRate(1);
   const shouldPlay=!!m.p;
   if(shouldPlay&&yt.getPlayerState()!==YT.PlayerState.PLAYING)yt.playVideo();

   follow=true;document.body.classList.add("follow");lastSeq=Math.max(lastSeq,Number(m.seq)||0);

function openSearchHub(){dlg(`<h3>🔎 Advanced Search</h3><div class="searchTabs"><button class="on" onclick="searchTab(this,'songs')">Songs</button><button onclick="searchTab(this,'artists')">Artists</button><button onclick="searchTab(this,'playlists')">Playlists</button><button onclick="searchTab(this,'history')">History</button><button onclick="searchTab(this,'local')">Local Library</button></div><input id="hubQ" placeholder="Search songs, artists, albums…" onkeydown="if(event.key==='Enter')runHubSearch()"><div id="hubResults" class="empty" style="padding:25px 0">Type a query and press Enter.</div>`)}
let hubTab="songs";function searchTab(b,t){hubTab=t;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(t!=="songs")renderHubStatic(t)}
function renderHubStatic(t){const b=$("hubResults");if(!b)return;if(t==="playlists"){b.innerHTML=names().map(n=>`<p>☰ <b>${esc(n)}</b> · ${D.lists[n].length} songs</p>`).join("")||"<p class='mut'>No playlists.</p>"}else if(t==="history"){b.innerHTML=(STATS.history||[]).slice(0,20).map(x=>`<p><b>${esc(x.title)}</b><br><span class='mut'>${esc(x.artist)}</span></p>`).join("")||"<p class='mut'>No history.</p>"}else if(t==="local"){offAll().then(a=>b.innerHTML=a.map(x=>`<p>♪ <b>${esc(x.title)}</b></p>`).join("")||"<p class='mut'>No local songs.</p>")}else b.innerHTML="<p class='mut'>Enter a query above.</p>"}
async function runHubSearch(){const q=$("hubQ")?.value.trim();if(!q)return;if(hubTab==="songs"||hubTab==="artists"){const r=await search(q);res=r;closeDlg();qry=q;view="home";paint();toast(`${r.length} results`)}else renderHubStatic(hubTab)}
function openNetworkHub(){const render=async()=>{const b=$("netHub");if(!b)return;const t0=performance.now();try{await fetch(location.origin+location.pathname,{cache:"no-store"});const ping=Math.round(performance.now()-t0);const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;b.innerHTML=`<div class="metric">${ping} ms</div><p>Local app ping · online: <b>${navigator.onLine?"YES":"NO"}</b></p><p>Connection: <b>${esc(c?.effectiveType||"unknown")}</b> · downlink ${c?.downlink||"?"} Mbps</p><p>Device memory: <b>${navigator.deviceMemory||"?"} GB</b> · cores ${navigator.hardwareConcurrency||"?"}</p><p>Room: <b>${room?room+" · "+(roomLeader?"LEADER":"FOLLOWER"):"Not connected"}</b></p>`}catch(e){b.innerHTML="<p class='mut'>Network probe unavailable.</p>"}};dlg(`<h3>🌐 Tech Network Monitor</h3><div id="netHub"><div class="spin"></div></div><p class="mut">Browser APIs expose only information available to this web app. Server CPU/RAM/storage metrics require a ShivTrix backend endpoint.</p>`);render()}
function initNetMini(){const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;const b=$("netMini");if(b)b.innerHTML=`<div class="metric">${navigator.onLine?"ONLINE":"OFFLINE"}</div><p>${esc(c?.effectiveType||"network unknown")} · ${c?.downlink||"?"} Mbps</p>`}
function setVizMode(m){window.vizMode=m;const x=$("vizMode");if(x)x.textContent=m}
let vizRAF=0;function drawViz(canvas){if(!canvas)return;const ctx=canvas.getContext("2d"),w=canvas.width=canvas.clientWidth*devicePixelRatio,h=canvas.height=canvas.clientHeight*devicePixelRatio,t=performance.now()/1000,mode=window.vizMode||"SPECTRUM";ctx.clearRect(0,0,w,h);ctx.save();ctx.scale(devicePixelRatio,devicePixelRatio);const W=canvas.clientWidth,H=canvas.clientHeight;ctx.strokeStyle="rgba(0,234,255,.65)";ctx.fillStyle="rgba(0,90,255,.08)";ctx.lineWidth=2;const amp=playing()?1:0.35;if(mode==="CIRCLE"){for(let r=90;r<Math.min(W,H)*.38;r+=28){ctx.beginPath();ctx.arc(W/2,H/2,r+Math.sin(t*3+r)*5,0,Math.PI*2);ctx.stroke()}}else if(mode==="PARTICLES"){for(let i=0;i<90;i++){const a=i*2.399+t*(.3+i%5*.02),r=(i*37+t*35)%Math.min(W,H)*.42;const x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;ctx.fillStyle=`rgba(0,${140+i%100},255,.${.25+i%6/10})`;ctx.fillRect(x,y,2+i%4,2+i%4)}}else{ctx.beginPath();for(let i=0;i<80;i++){const x=i/79*W;const v=(Math.sin(i*.65+t*4)+Math.sin(i*.19-t*2)+Math.sin(i*.09+t))*0.33*amp;const y=H*.52+v*H*.28*(mode==="WAVE"?1.2:1);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();if(mode==="SPECTRUM"){for(let i=0;i<64;i++){const x=i/64*W,b=(Math.sin(i*.9+t*5)+1)*.5*H*.25*amp;ctx.fillStyle=`rgba(0,180,255,.${.18+(i%5)/12})`;ctx.fillRect(x,H*.9-b,W/100,b)}}}ctx.restore();vizRAF=requestAnimationFrame(()=>drawViz(canvas))}
function toggleVisualizer(on){const el=$("cyberViz");if(on){el.classList.add("open");setVizMode(window.vizMode||"SPECTRUM");cancelAnimationFrame(vizRAF);drawViz($("vizFullCanvas"))}else{el.classList.remove("open");cancelAnimationFrame(vizRAF)}}
let inlineVizStarted=false;function startInlineViz(){if(inlineVizStarted)return;inlineVizStarted=true;drawViz($("viz"))}

/* ---------- init ---------- */
function resize(){$("menuBtn").style.display=innerWidth<=900?"grid":"none"}
addEventListener("resize",resize);resize();
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("dlg").classList.contains("open"))closeDlg();else if($("cyberViz").classList.contains("open"))toggleVisualizer(false);else if($("pl").classList.contains("open"))minPl();return}if(e.ctrlKey&&e.key.toLowerCase()==="k"){e.preventDefault();openSearchHub();return}const tag=(e.target?.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;if(e.code==="Space"){e.preventDefault();togglePlay()}else if(e.key==="ArrowLeft"){e.preventDefault();seekTo(Math.max(0,time()-5))}else if(e.key==="ArrowRight"){e.preventDefault();seekTo(Math.min(dur(),time()+5))}else if(e.key==="ArrowUp"){e.preventDefault();au.volume=Math.min(1,au.volume+.05)}else if(e.key==="ArrowDown"){e.preventDefault();au.volume=Math.max(0,au.volume-.05)}else if(e.key.toLowerCase()==="m"){e.preventDefault();au.muted=!au.muted}else if(e.key.toLowerCase()==="f"){e.preventDefault();toggleFocus()}else if(e.key.toLowerCase()==="n"){e.preventDefault();next(false)}else if(e.key.toLowerCase()==="p"){e.preventDefault();prev()}else if(e.key==="/"){e.preventDefault();openSearchHub()}});
if(localStorage.getItem(THEME_KEY)==="light")document.body.classList.add("light");
load();paint();startInlineViz();
const rm=/#room=([A-Z0-9]{8})/.exec(location.hash);if(rm){enterRoom(rm[1],false);toast("Joined room "+rm[1])}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{}));
</script>
