<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030407">
<meta name="description" content="ShivTrixYouTube - music player">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShivTrixYouTube">
<title>ShivTrixYouTube</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#030407;--panel:#0b0f17;--panel2:#101620;--line:#1b2635;--blue:#0066ff;--blue2:#00a8ff;--neon:#00eaff;--text:#f4f7fb;--muted:#8e9bad;--red:#ff4268}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.mut{color:var(--muted)}
.btn{height:38px;padding:0 14px;border-radius:19px;border:1px solid #1e2c3f;background:#0b111a;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#28527b}.btn.pri{border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;font-size:18px;display:grid;place-items:center}
.ib:hover{background:#101a28}.ib.on{color:var(--neon)}.ib.big{width:54px;height:54px;background:#fff;color:#000;font-size:22px}
.ib.liked{color:var(--red)}
/* top bar */
#top{position:fixed;inset:0 0 auto 0;height:64px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(3,4,7,.92);backdrop-filter:blur(16px);border-bottom:1px solid #0e1622}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;letter-spacing:-.5px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#0055ff,#00d9ff);box-shadow:0 0 16px rgba(0,170,255,.45);font-size:13px}
.brand b{color:var(--neon)}
#q{flex:1;max-width:560px;margin:0 auto;height:42px;border-radius:21px;border:1px solid #1b2a3e;background:#0a0f17;padding:0 18px;outline:none}
#q:focus{border-color:rgba(0,234,255,.55)}
/* sidebar */
#side{position:fixed;top:64px;bottom:0;left:0;width:240px;z-index:40;padding:10px 12px 90px;overflow-y:auto;background:var(--bg);border-right:1px solid #0e1622;transition:transform .2s}
.nv{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:none;text-align:left;font-weight:700;font-size:14px;color:#c9d4e2}
.nv:hover{background:#0d1622}.nv.on{background:#13243b;color:#fff}
.nv small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.sh{padding:16px 14px 6px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:10px 4px}
#main{position:absolute;top:64px;bottom:0;left:240px;right:0;overflow-y:auto;padding:16px 22px 120px}
/* pills */
.slide{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.pills{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:9px;border:1px solid #1a293b;background:#0b121c;font-size:13px;font-weight:700;color:#c3cfdf}
.pill.on{background:#fff;color:#000;border-color:#fff}
.ar{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #1a293b;background:#0b121c}
h1.vt{font-size:26px;margin:4px 0 14px;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.cd{position:relative;cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#05070a}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.art{width:100%;height:100%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#0a3a8a,#04122e)}
.du{position:absolute;right:6px;bottom:6px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.8);font-size:11px;font-weight:800}
.ca{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px}
.ca button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px}
.ca button:hover{background:rgba(0,120,255,.9)}.ca .liked{color:var(--red)}
@media(hover:hover){.ca{opacity:0;transition:.15s}.cd:hover .ca{opacity:1}}
.ct{margin-top:8px;font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:12px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{height:84px;border-radius:12px;border:0;font-weight:800;font-size:16px;text-align:left;padding:14px;background:linear-gradient(135deg,#0b3d91,#06142f)}
.tile:hover{background:linear-gradient(135deg,var(--blue),#06142f)}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--muted)}
.spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid #17314d;border-top-color:var(--neon);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* mini bar */
#mini{display:none;position:fixed;left:240px;right:0;bottom:0;z-index:60;height:68px;align-items:center;gap:10px;padding:0 14px;background:#0b1320;border-top:1px solid var(--line)}
body.mini #mini{display:flex}
#mini img{width:88px;height:50px;object-fit:cover;border-radius:8px;background:#000;flex:none}
#mini .tx{flex:1;min-width:0;cursor:pointer}
#mini .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* player overlay */
#pl{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#06101f,#030407 60%);transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#pl.open{transform:none}
.plh{height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;flex:none}
.plh b{flex:1;font-size:16px}
.plb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;padding:0 22px 18px}
.pll{overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.vbox{position:relative;width:min(100%,760px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
#ytp,#ytp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.oart,#au{display:none}
.vbox.offl #ytp{display:none}.vbox.offl .oart{display:grid;position:absolute;inset:0;place-items:center;font-size:80px;background:linear-gradient(135deg,#0a3a8a,#04122e)}
.vbox.offl #au{display:block;position:absolute;left:0;right:0;bottom:0;width:100%;z-index:2}
.pll h2{width:min(100%,760px);margin:16px 0 2px;font-size:20px}
.pll .mut{width:min(100%,760px);font-weight:700}
#seek{width:min(100%,760px);margin-top:14px;accent-color:var(--blue2)}
.tm{width:min(100%,760px);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.plr{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:16px;background:rgba(11,15,23,.8)}
.from{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.from small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.from b{display:block;font-size:15px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:13px 4px;border:0;background:none;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:#fff}
#tb{flex:1;overflow-y:auto;padding:10px}
.qi{display:flex;align-items:center;gap:10px;padding:7px;border-radius:10px;cursor:pointer}
.qi:hover{background:#0d1622}.qi.cur{background:rgba(0,120,255,.2)}.qi.done{opacity:.5}
.qi .im{width:76px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none;background:#000}
.qi img{width:100%;height:100%;object-fit:cover}.qi .art{font-size:20px}
.qi .tx{flex:1;min-width:0}.qi .t{font-size:13px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qi .a{font-size:12px;color:var(--muted)}.qx{border:0;background:none;font-size:18px;color:var(--muted)}
.lyr{white-space:pre-wrap;line-height:1.9;font-size:16px;padding:8px 10px}
.cm{padding:10px 8px;border-bottom:1px solid #111b29;font-size:13px;line-height:1.5}.cm b{font-size:12px;color:var(--neon)}
body.follow .ctl .nf,body.follow #seek{pointer-events:none;opacity:.5}
/* dialog */
#dlg{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
#dlg.open{display:flex}
.box{width:min(420px,100%);max-height:86vh;overflow-y:auto;border-radius:18px;border:1px solid #1d3045;background:#0b121c;padding:18px}
.box h3{margin:0 0 12px}.box .btn{display:block;width:100%;margin-top:8px;text-align:left;border-radius:12px}
.box input{width:100%;height:40px;margin-top:8px;border-radius:12px;border:1px solid #1c2c3e;background:#070c13;padding:0 12px}
.code{font-size:32px;font-weight:900;letter-spacing:6px;color:var(--neon);text-align:center;padding:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:400;max-width:90vw;padding:11px 16px;border-radius:12px;border:1px solid #1e3349;background:#0b1320;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.scan{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1}#sv{width:100%;height:100%;object-fit:cover}.scan i{position:absolute;inset:18%;border:2px solid var(--neon);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.qr{background:#fff;padding:12px;border-radius:14px;width:210px;margin:6px auto}.qr svg{width:100%;height:auto;display:block}
.eq{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px}.eq span{width:70px;flex:none}.box input[type=range]{flex:1;height:22px;padding:0;margin:0;border:0;background:none;accent-color:var(--blue2)}
.prs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.stc{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);line-height:1.8;font-size:14px}.stc small{display:block;color:var(--muted);font-weight:800;letter-spacing:.08em;font-size:11px}
.hrs{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}.hrs i{flex:1;background:linear-gradient(var(--neon),var(--blue));border-radius:3px 3px 0 0}
#viz{width:min(100%,760px);height:64px;margin-top:10px;border-radius:12px;background:#05080e}
/* tv receiver */
body.tv #top,body.tv #side,body.tv #main,body.tv #mini,body.tv .plh,body.tv .plr,body.tv .ctl,body.tv #seek,body.tv .tm{display:none!important}
body.tv .plb{display:block;padding:0}body.tv #pl{transform:none}body.tv .vbox{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
body.tv .pll{overflow:hidden}body.tv .pll h2,body.tv .pll .mut{display:none}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--top:calc(60px + var(--sat));--bn:0px}
html{-webkit-text-size-adjust:100%}body{overscroll-behavior:none;touch-action:manipulation}
#top{height:var(--top);padding-top:var(--sat)}#side{top:var(--top)}#main{top:var(--top)}
#q{font-size:16px;min-width:0}
#rchip{display:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid #1e4a6e;background:#0b1e33;font-size:12px;font-weight:800;color:var(--neon);white-space:nowrap}
body.inroom #rchip{display:inline-flex;align-items:center}
#bnav{display:none}
#mbar{position:absolute;left:0;right:0;top:0;height:2px;background:#16263b}#mbi{display:block;height:100%;width:0;background:var(--neon)}
.tap{display:none;position:absolute;inset:0;z-index:5;place-items:center;background:rgba(0,0,0,.72);font-weight:800;font-size:17px;border:0;color:#fff;width:100%;padding:20px;text-align:center}
body.needtap .tap{display:grid}
body.follow .ctl .nf,body.follow #seek{pointer-events:auto;opacity:1}
@media(min-width:1500px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
@media(max-width:900px){
 :root{--bn:calc(58px + var(--sab))}
 #menuBtn{display:grid}#castBtn,#scanBtn,#eqBtn{display:none}
 #top{gap:8px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
 .brand span{display:none}#q{margin:0;height:40px}
 #side{transform:translateX(-100%);width:min(300px,86vw);z-index:70;box-shadow:10px 0 40px #000;top:0;padding-top:calc(var(--sat) + 10px);padding-bottom:calc(30px + var(--sab))}
 body.menu #side{transform:none}
 body.menu::after{content:"";position:fixed;inset:0;z-index:66;background:rgba(0,0,0,.55)}
 #main{left:0;padding:12px 12px calc(var(--bn) + 90px)}
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:62;height:var(--bn);padding-bottom:var(--sab);background:rgba(7,11,18,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
 #bnav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted)}
 #bnav button span{font-size:20px;line-height:1}#bnav button.on{color:#fff}body.inroom #bnav .rm{color:var(--neon)}
 #mini{left:0;right:0;bottom:var(--bn);height:62px;padding:0 8px 0 10px}#mini img{width:76px;height:43px}
 #toast{bottom:calc(var(--bn) + 78px)}
 .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 12px}.tiles{grid-template-columns:repeat(2,1fr)}h1.vt{font-size:22px}
 #pl{height:100dvh}
 .plh{height:calc(54px + var(--sat));padding-top:var(--sat)}
 .plb{display:block;overflow-y:auto;padding:0 0 calc(24px + var(--sab));-webkit-overflow-scrolling:touch}
 .pll{overflow:visible;padding:0;align-items:stretch}
 .vbox{width:100%;border-radius:0}
 .pll h2{width:auto;margin:14px 16px 2px;font-size:19px}.pll .mut{width:auto;margin:0 16px}
 #viz{width:calc(100% - 32px);margin:10px 16px 0;height:44px}
 #seek{width:calc(100% - 32px);margin:10px 16px 0;height:28px}.tm{width:auto;margin:0 16px}
 .ctl{justify-content:space-between;padding:0 14px;margin-top:8px}
 .ib{width:46px;height:46px}.ib.big{width:64px;height:64px}
 .plr{margin:14px 12px 0;min-height:62dvh}
 .tabs button{padding:15px 4px}
 #dlg{align-items:flex-end;padding:0}
 .box{width:100%;max-height:90dvh;border-radius:20px 20px 0 0;padding-bottom:calc(18px + var(--sab))}
}
@media(max-width:560px){
 .grid{grid-template-columns:1fr;gap:10px}
 .cd{display:grid;grid-template-columns:132px minmax(0,1fr);column-gap:12px;align-items:start}
 .cd .th{grid-row:1/4;grid-column:1}.cd .ct{grid-column:2;margin-top:0}.cd .cs{grid-column:2}
 .cd .ca{position:static;grid-column:2;flex-direction:row;opacity:1;margin-top:6px;gap:8px}
 .ca button{width:36px;height:36px;background:#101a28}
 #mini>button:nth-of-type(1){display:none}
}
@media(max-width:900px) and (orientation:landscape) and (max-height:520px){
 :root{--bn:0px}#bnav{display:none}
 .plb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;overflow:hidden;padding:0 12px 8px}
 .pll{overflow-y:auto}.vbox{border-radius:12px}.plr{margin:0;min-height:0;height:100%}#viz{display:none}.plh{height:calc(44px + var(--sat))}
}

/* ===== v3 additions ===== */
:root{--ring:#ff8a1f;--glow:rgba(255,138,31,.55)}
/* metallic media buttons (brushed steel + glowing ring) — change --ring/--glow above to re-colour */
.mb{--s:46px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;border:0;padding:0;margin:0 4px;display:grid;place-items:center;color:#2b2b2b;
 background:conic-gradient(from 25deg,#e2e2e2,#8d8d8d,#f1f1f1,#7a7a7a,#d6d6d6,#8a8a8a,#ececec,#e2e2e2);
 box-shadow:0 0 0 1.5px #a9a9a9,0 0 0 3.5px var(--ring),0 0 14px 3px var(--glow),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 6px rgba(0,0,0,.35);
 transition:transform .08s,filter .15s}
.mb::before{content:"";position:absolute;inset:16%;border-radius:50%;background:conic-gradient(from 0deg,#d4d4d4,#9a9a9a,#f4f4f4,#8b8b8b,#dcdcdc,#9c9c9c,#efefef,#d4d4d4);box-shadow:inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 4px rgba(0,0,0,.35)}
.mb svg{position:relative;width:44%;height:44%;fill:currentColor;display:block}
.mb b{position:relative;font-size:11px;font-weight:900;color:inherit}
.mb:hover{filter:brightness(1.08)}.mb:active{transform:scale(.92)}
.mb.on{color:#c45300}.mb.liked{color:#e0143c}
.mb.sm{--s:34px}.mb.md{--s:46px}.mb.xl{--s:72px}.mb.xl::before{inset:14%}
.ctl{gap:12px}.ctl2{flex-wrap:wrap;justify-content:center;gap:14px 10px;width:min(100%,760px);margin-top:16px}
.ctl2 input[type=range]{flex:1 1 90px;min-width:90px;accent-color:var(--ring);height:24px}
body.follow .ctl .nf{pointer-events:auto;opacity:1}
#mini .mb{margin:0 3px}
/* stream video */
#vp{display:none;position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;z-index:1}
.vbox.str #ytp{display:none}.vbox.str #vp{display:block}.vbox.offl #vp{display:none}
.vbox.ld::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;border:3px solid #17314d;border-top-color:var(--neon);animation:sp .8s linear infinite;z-index:3}
/* popup player */
#popbar{display:none;align-items:center;gap:8px;padding:8px 10px;background:#0b1320;cursor:grab;touch-action:none}
#popbar span{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.pop #popbar{display:flex}
body.pop #pl{inset:auto 14px calc(var(--bn) + 80px) auto;width:min(340px,72vw);height:auto!important;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #000;border:1px solid #1d3045;background:#000;z-index:95;transform:none}
body.pop #pl:not(.open){display:none}
body.pop .plh,body.pop .plr,body.pop #viz,body.pop #seek,body.pop .tm,body.pop .ctl,body.pop .pll h2,body.pop .pll .mut{display:none!important}
body.pop .plb{display:block;padding:0;overflow:visible}body.pop .pll{display:block;padding:0;overflow:visible}body.pop .vbox{width:100%;border-radius:0}
/* links, avatars, channel pages */
.lk{cursor:pointer}.lk:hover{color:#fff;text-decoration:underline}
.av{position:relative;flex:none;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#0a3a8a,#04122e);font-weight:900}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.hrow h1{margin:4px 0 10px}
.sht{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.sht b{font-size:20px;letter-spacing:-.3px}
.chs{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}
.chi{flex:none;width:96px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.chi b{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.chi small{font-size:11px;color:var(--muted)}
.chh{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}.chm{flex:1;min-width:160px}.chb{display:flex;gap:8px;flex-wrap:wrap}
.ctabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
.ctabs button{padding:12px 18px;border:0;background:none;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid transparent}.ctabs button.on{color:#fff;border-color:#fff}
/* first-run interests */
#ob{position:fixed;inset:0;z-index:350;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 0,#0a1f3d,#030407 70%)}
#ob.open{display:flex}
.obb{width:min(580px,100%);max-height:96dvh;overflow-y:auto;text-align:center}
.obb h2{font-size:28px;margin:0 0 6px}
.obc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.chip{padding:12px 18px;border-radius:26px;border:1px solid #1d3045;background:#0b121c;font-weight:700;font-size:14px}
.chip.on{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff}
.obi{display:flex;gap:8px;margin-bottom:14px}.obi input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid #1c2c3e;background:#070c13;padding:0 18px;font-size:16px;outline:none}
.obb>.btn{display:block;width:100%;margin-top:8px;height:44px}.btn:disabled{opacity:.4}
@media(max-width:900px){.ctl{padding:0 6px}.ctl .mb{margin:0 2px}.mb.xl{--s:66px}.ctl2{padding:0 12px}}
@media(max-width:560px){.mb.md{--s:42px}.mb.sm{--s:32px}.ctl{gap:6px}}
