<style>

.card input{width:100%;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center;outline:0}.card input:focus{border-color:var(--bl);box-shadow:var(--g)}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0d1a4d;border:1px solid var(--bl);box-shadow:var(--g);padding:10px 18px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.2s;max-width:90vw}.toast.on{opacity:1}

  <div class="me">

  <div class="list" id="list"></div>
</aside>
<main class="main">
  <div class="splash" id="splash"><div><h1>RoyalRoom</h1>End-to-end encrypted rooms for up to 4 people.<br>Identity is a cryptographic key, so IDs can't be faked.</div></div>
  <section class="chat" id="chat" hidden>
    <div class="hd"><button class="ib back" id="bBack">‹</button><div id="cav" class="dot"></div>
      <div class="t" id="ct"><div class="n" id="cn"></div><div class="s" id="cs"></div></div>
      <button class="ib" id="bInv" title="Room info and invite">ⓘ</button><button class="ib" id="bVid" title="Video call">🎥</button><button class="ib" id="bVoi" title="Voice call">📞</button></div>
    <div class="stream" id="stream"></div>
    <div class="foot"><div class="emo" id="emo" hidden></div>
      <button class="ib" id="bEmo">😊</button><button class="ib" id="bAtt" title="Share photo, video or file">📎</button><input type="file" id="file" hidden>
      <input type="text" id="msg" placeholder="Type a message" autocomplete="off"><button class="ib" id="bMic" title="Voice note">🎤</button><button class="send" id="bSend">➤</button></div>
  </section>
</main></div>
<div id="ovs"></div><div class="toast" id="toast"></div>
<script>

/* ---------- network ---------- */

function askName(){return new Promise(res=>{
  const o=overlay(`<h2>Choose your name</h2><input id="un" maxlength="24" autocomplete="off" placeholder="Your name"><p>Others will see it with your unique tag, like <b>Name#${me.id.slice(-4)}</b>. Your full ID stays hidden.</p><div class="row"><button class="btn p" id="unb">Continue</button></div>`);
  o.onclick=null;const i=o.querySelector('#un'),go=()=>{const n=i.value.trim().replace(/#/g,'').slice(0,24);if(n.length<2)return toast('Pick a name with at least 2 characters.');me.name=n;saveMe();o.close();res()};
  o.querySelector('#unb').onclick=go;i.onkeydown=e=>e.key==='Enter'&&go();i.focus()})}
document.addEventListener('keydown',e=>{   // typing anywhere goes to the message box (fixes lost keyboard focus)
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;
  if(cur&&!$('#callui')&&!$('#lock')&&!$('#ovs').childElementCount)$('#msg').focus()});
(async()=>{
  await gate();
  if(!crypto.subtle)return setSt('Needs https (secure context)');
  try{await initId()}catch(e){return setSt('Crypto init failed: '+e.message)}
  if(!me.name)await askName();
  ui();setSt('Loading network library…');
  if(!await loadPeer())return setSt('Could not load PeerJS. Check your internet or ad-blocker.');
  start();hashJoin()
})();
</script></body></html>
