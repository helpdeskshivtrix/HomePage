<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro ID Generator</title>
  <meta name="theme-color" content="#4f46e5">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: var(--card);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 1.75rem; color: #fff; }
    .display-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.1rem;
      word-break: break-all;
      margin: 1.5rem 0;
      min-height: 24px;
      border: 1px solid #334155;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s;
    }
    .display-box:hover { border-color: var(--primary); }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    .history {
      margin-top: 2rem;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
    }
    .history h3 { font-size: 0.9rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }
    .history ul { list-style: none; padding: 0; margin: 0; }
    .history li {
      font-family: monospace;
      padding: 0.5rem;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }
    .history li:hover { color: var(--accent); }
    .toast {
      position: fixed;
      bottom: 20px;
      background: var(--accent);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
  </style>
  <script>
    // Inline PWA Manifest Data URI
    const manifest = {
      name: "Professional Unique ID Generator",
      short_name: "Pro ID Gen",
      start_url: ".",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#6366f1",
      icons: [{
        src: "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='512' height='512' viewBox='0 0 512 512'><rect width='512' height='512' rx='15%' fill='%236366f1'/><path d='M150 150h212v212H150z' fill='none' stroke='white' stroke-width='40'/></svg>",
        sizes: "512x512",
        type: "image/svg+xml"
      }]
    };
    const manifestStr = JSON.stringify(manifest);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(manifestStr)));
    document.head.appendChild(link);
  </script>
</head>
<body>

  <div class="container">
    <h1>Pro ID Generator</h1>
    <div class="display-box" id="idDisplay" title="Click to copy">Click Generate</div>
    <button id="genBtn">Generate UUID v4</button>
    
    <div class="history">
      <h3>History Log</h3>
      <ul id="historyList"></ul>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const idDisplay = document.getElementById('idDisplay');
    const genBtn = document.getElementById('genBtn');
    const historyList = document.getElementById('historyList');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => toast.style.opacity = '0', 2000);
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
    }

    genBtn.addEventListener('click', () => {
      const uuid = crypto.randomUUID();
      idDisplay.innerText = uuid;
      
      // Add to UI log
      const li = document.createElement('li');
      li.innerText = uuid;
      li.onclick = () => copyToClipboard(uuid);
      historyList.insertBefore(li, historyList.firstChild);
    });

    idDisplay.addEventListener('click', () => {
      if(idDisplay.innerText !== 'Click Generate') {
        copyToClipboard(idDisplay.innerText);
      }
    });

    // Dynamic Base64 Service Worker Setup for Offline PWA Installation
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swContent = `
          const CACHE_NAME = 'id-gen-v1';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', e => {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request) || new Response("Offline Content"))
            );
          });
        `;
        const swBlob = new Blob([swContent], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW setup bypassed:', err));
      });
    }
  </script>
</body>
</html>
