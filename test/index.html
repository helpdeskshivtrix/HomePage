<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RoyalRoom</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bl:#4169e1;--bl2:#6f8cff;--bg:#000;--pn:#05070f;--cd:#0a0f1f;--ln:#14204a;--tx:#e8edff;--t2:#7f8bb5;--glow:0 0 14px rgba(65,105,225,.55);--red:#ff3b5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(300px,340px) 1fr;height:100dvh}
.side{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.me{padding:16px;border-bottom:1px solid var(--ln);background:linear-gradient(180deg,#07102e,var(--pn))}
.me .nm{font-weight:600;font-size:17px;cursor:pointer}
.rid{display:inline-block;margin-top:6px;padding:5px 10px;border:1px solid var(--bl);border-radius:8px;color:var(--bl2);letter-spacing:2px;font-family:ui-monospace,monospace;box-shadow:var(--glow);cursor:pointer}
.st{font-size:12px;color:var(--t2);margin-top:6px}.st i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}.st.on i{background:#3dffa0;box-shadow:0 0 8px #3dffa0}
.row{display:flex;gap:8px;margin-top:12px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--tx)}
.btn:hover{border-color:var(--bl)}
.btn.p{background:var(--bl);border-color:var(--bl);box-shadow:var(--glow);font-weight:600}
.join{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.join input,.foot input[type=text]{flex:1;min-width:0;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;outline:0;text-transform:none}
.join input:focus,.foot input:focus{border-color:var(--bl);box-shadow:var(--glow)}
.list{flex:1;overflow-y:auto}
.it{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid #0b1230}
.it:hover,.it.a{background:var(--cd)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:#0d1a4d;border:1px solid var(--bl);box-shadow:var(--glow)}
.it .b{flex:1;min-width:0}.it .n{display:flex;justify-content:space-between;gap:8px}.it .p2{color:var(--t2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--bl);border-radius:10px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 6px;box-shadow:var(--glow)}
.empty{padding:28px;text-align:center;color:var(--t2)}
.splash{flex:1;display:grid;place-items:center;text-align:center;color:var(--t2);padding:24px}
.splash h1{color:var(--bl2);text-shadow:0 0 22px var(--bl);font-weight:300;font-size:30px;margin-bottom:8px}
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.hd{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--ln)}
.hd .t{flex:1;min-width:0}.hd .n{font-weight:600}.hd .s{font-size:12px;color:var(--t2);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:50%;font-size:18px}.ib:hover{background:var(--cd);box-shadow:var(--glow)}
.back{display:none}
.stream{flex:1;overflow-y:auto;padding:16px max(4%,12px);display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 50% 0,#06102e 0,#000 60%)}
.m{max-width:min(72%,520px);padding:8px 11px;border-radius:12px;background:var(--cd);border:1px solid var(--ln);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.m.o{align-self:flex-end;background:linear-gradient(135deg,#2e52d6,var(--bl));border-color:var(--bl2);box-shadow:var(--glow)}
.m small{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:3px}
.m img,.m video{display:block;max-width:100%;max-height:320px;border-radius:8px}
.m a{color:#fff}
.sys{align-self:center;color:var(--t2);font-size:12px;border:1px solid var(--ln);border-radius:8px;padding:4px 10px}
.foot{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--pn);border-top:1px solid var(--ln)}
.send{width:42px;height:42px;border-radius:50%;background:var(--bl);box-shadow:var(--glow);font-size:18px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}
.card{background:var(--pn);border:1px solid var(--bl);border-radius:16px;box-shadow:0 0 30px rgba(65,105,225,.4);padding:20px;max-width:380px;width:100%;text-align:center}
.card h2{font-weight:500;margin-bottom:12px}.card .qr{background:#fff;border-radius:12px;padding:12px;display:inline-block}.card .qr svg{display:block;width:230px;height:230px}
.card video{width:100%;border-radius:12px;background:#000;max-height:50dvh;object-fit:cover}
.card p{color:var(--t2);font-size:13px;margin-top:10px}
.call{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
#rv{width:100%;flex:1;min-height:0;object-fit:contain;border-radius:14px;background:#050a1c;box-shadow:inset 0 0 40px rgba(65,105,225,.25)}
#lv{position:absolute;right:20px;top:calc(76px + env(safe-area-inset-top));width:110px;border-radius:10px;border:1px solid var(--bl);box-shadow:var(--glow);transform:scaleX(-1)}
.call h2{font-weight:400;margin:6px 0 12px;text-shadow:0 0 14px var(--bl)}
.ctl{display:flex;gap:16px;margin-top:16px}.ctl button{width:58px;height:58px;border-radius:50%;background:var(--cd);border:1px solid var(--bl);font-size:22px}
.ctl .end{background:var(--red);border-color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d1a4d;border:1px solid var(--bl);box-shadow:var(--glow);padding:10px 16px;border-radius:10px;z-index:90;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}
@media(max-width:760px){.app{grid-template-columns:1fr}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.back{display:inline-block}.m{max-width:86%}}
</style></head><body>
<div class="app" id="app">
<aside class="side">
  <div class="me">
    <div class="nm" id="nm" title="Tap to rename"></div>
    <div class="rid" id="rid" title="Copy your room ID"></div>
    <div class="st" id="st"><i></i><span>Connecting…</span></div>
    <div class="row"><button class="btn p" id="bQR">My QR</button><button class="btn" id="bScan">Scan QR</button></div>
  </div>
  <div class="join"><input id="jid" placeholder="Enter a room ID to join" autocomplete="off" autocapitalize="characters"><button class="btn p" id="bJoin">Join</button></div>
  <div class="list" id="list"></div>
</aside>
<main class="main">
  <div class="splash" id="splash"><div><h1>RoyalRoom</h1>Share your room ID or QR, or scan someone's.<br>When two people join, the room ID becomes both IDs combined.</div></div>
  <section class="chat" id="chat" hidden>
    <div class="hd"><button class="ib back" id="bBack">‹</button><div class="av" id="cav"></div>
      <div class="t"><div class="n" id="cn"></div><div class="s" id="cs"></div></div>
      <button class="ib" id="bVid" title="Video call">🎥</button><button class="ib" id="bVoi" title="Voice call">📞</button></div>
    <div class="stream" id="stream"></div>
    <div class="foot"><button class="ib" id="bAtt" title="Share photo, video or file">📎</button><input type="file" id="file" hidden>
      <input type="text" id="msg" placeholder="Type a message" autocomplete="off"><button class="send" id="bSend">➤</button></div>
  </section>
</main></div>
<div id="ovs"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v,(a,b)=>a==='url'?undefined:b));
const PID=id=>'royalroom-'+id;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3000)};
const rnd=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=crypto.getRandomValues(new Uint8Array(8));return[...a].map(x=>c[x%c.length]).join('')};
let me=LS('me');if(!me){me={id:rnd(),name:'User '+Math.floor(Math.random()*900+100)};LS('me',me)}
let rooms=LS('rooms')||{},cur=null,peer,conns={},online=new Set(),call=null,lstream=null,pendingCall=null;
const roomId=pid=>[me.id,pid].sort().join('-');           // combined unique id of both users
const hasPeer=pid=>online.has(pid);
const save=()=>LS('rooms',rooms);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

/* ---------- peer / signaling ---------- */
function start(){
  peer=new Peer(PID(me.id));
  peer.on('open',()=>{$('#st').classList.add('on');$('#st span').textContent='Online · room is open';Object.keys(rooms).forEach(p=>link(p,true))});
  peer.on('disconnected',()=>{$('#st').classList.remove('on');$('#st span').textContent='Reconnecting…';peer.reconnect()});
  peer.on('error',e=>{
    if(e.type==='unavailable-id')toast('This ID is open in another tab or device.');
    else if(e.type==='peer-unavailable')toast('That room is offline or the ID is wrong.');
    else if(e.type!=='network')toast('Connection error: '+e.type)});
  peer.on('connection',c=>wire(c));
  peer.on('call',c=>{pendingCall=c;incoming(c)});
}
function link(pid,quiet){
  if(conns[pid]&&conns[pid].open)return conns[pid];
  if(!peer||!peer.open){if(!quiet)toast('Still connecting…');return}
  return wire(peer.connect(PID(pid),{reliable:true}));
}
function wire(c){
  const pid=c.peer.replace('royalroom-','');
  c.on('open',()=>{conns[pid]=c;online.add(pid);c.send({t:'hello',name:me.name});if(!rooms[pid])addRoom(pid);ui()});
  c.on('data',d=>got(pid,d));
  c.on('close',()=>{online.delete(pid);if(conns[pid]===c)delete conns[pid];ui()});
  c.on('error',()=>{online.delete(pid);ui()});
  return c;
}
function addRoom(pid,name){
  if(!rooms[pid]){rooms[pid]={name:name||pid,msgs:[],unread:0,ts:Date.now()};
    rooms[pid].msgs.push({sys:1,text:'Room created: '+roomId(pid),ts:Date.now()});save()}
}
function got(pid,d){
  addRoom(pid);const r=rooms[pid];
  if(d.t==='hello'){if(d.name&&r.name!==d.name){r.name=d.name;save()}ui();return}
  let m={me:0,ts:Date.now()};
  if(d.t==='msg')m.text=d.text;
  else if(d.t==='file'){m.file={name:d.name,mime:d.mime};m.url=URL.createObjectURL(new Blob([d.buf],{type:d.mime}))}
  else return;
  r.msgs.push(m);r.ts=m.ts;if(cur!==pid)r.unread++;save();ui()
}

/* ---------- joining ---------- */
function join(raw){
  const id=(raw||'').trim().toUpperCase().replace(/^ROYALROOM:/,'');
  if(!/^[A-Z0-9]{8}$/.test(id))return toast('Room IDs are 8 characters.');
  if(id===me.id)return toast('That is your own room ID.');
  addRoom(id);link(id);open(id);
}

/* ---------- UI ---------- */
function ui(){
  $('#nm').textContent=me.name;$('#rid').textContent=me.id;
  const ids=Object.keys(rooms).sort((a,b)=>rooms[b].ts-rooms[a].ts),L=$('#list');L.replaceChildren();
  if(!ids.length)L.innerHTML='<div class="empty">No rooms yet.<br>Join one by ID or scan a QR.</div>';
  for(const p of ids){
    const r=rooms[p],l=[...r.msgs].reverse().find(m=>!m.sys),b=document.createElement('button');
    b.className='it'+(cur===p?' a':'');
    b.innerHTML=`<div class="av">${esc(r.name.slice(0,2).toUpperCase())}</div><div class="b"><div class="n"><span>${esc(r.name)}</span><span>${hasPeer(p)?'🟢':''}</span></div><div class="p2">${esc(roomId(p))}${l?' · '+esc(l.file?'📎 '+l.file.name:l.text):''}</div></div>${r.unread?`<span class="bd">${r.unread}</span>`:''}`;
    b.onclick=()=>{open(p);link(p)};L.append(b)}
  if(cur&&rooms[cur])chat()
}
function open(p){cur=p;rooms[p].unread=0;save();$('#app').classList.add('open');$('#splash').hidden=true;$('#chat').hidden=false;ui()}
function chat(){
  const r=rooms[cur];$('#cn').textContent=r.name;$('#cav').textContent=r.name.slice(0,2).toUpperCase();
  $('#cs').textContent='Room '+roomId(cur)+' · '+(hasPeer(cur)?'online':'offline');
  const s=$('#stream');s.replaceChildren();
  for(const m of r.msgs){
    const d=document.createElement('div');
    if(m.sys){d.className='sys';d.textContent=m.text}
    else{d.className='m'+(m.me?' o':'');
      let body='';
      if(m.file){
        if(!m.url)body='📎 '+esc(m.file.name)+' (not stored)';
        else if(m.file.mime.startsWith('image/'))body=`<img src="${m.url}">`;
        else if(m.file.mime.startsWith('video/'))body=`<video src="${m.url}" controls playsinline></video>`;
        else body=`<a href="${m.url}" download="${esc(m.file.name)}">📎 ${esc(m.file.name)}</a>`}
      else body=esc(m.text);
      d.innerHTML=body+`<small>${tm(m.ts)}</small>`}
    s.append(d)}
  s.scrollTop=s.scrollHeight
}
function send(){
  const v=$('#msg').value.trim();if(!v||!cur)return;
  const c=conns[cur];if(!c||!c.open){link(cur);return toast('Peer is offline. Trying to reconnect…')}
  c.send({t:'msg',text:v});$('#msg').value='';
  rooms[cur].msgs.push({me:1,text:v,ts:Date.now()});rooms[cur].ts=Date.now();save();ui()
}
async function sendFile(f){
  const c=conns[cur];if(!c||!c.open)return toast('Peer is offline.');
  if(f.size>64*1048576)return toast('Max file size is 64 MB.');
  const buf=await f.arrayBuffer();c.send({t:'file',name:f.name,mime:f.type||'application/octet-stream',buf});
  const m={me:1,ts:Date.now(),file:{name:f.name,mime:f.type||'application/octet-stream'},url:URL.createObjectURL(f)};
  rooms[cur].msgs.push(m);rooms[cur].ts=m.ts;save();ui()
}

/* ---------- QR ---------- */
function overlay(html){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card">${html}</div>`;o.onclick=e=>{if(e.target===o)o.close()};o.close=()=>{o.stream&&o.stream.getTracks().forEach(t=>t.stop());o.stop=1;o.remove()};$('#ovs').append(o);return o}
function showQR(){
  const q=qrcode(0,'M');q.addData('royalroom:'+me.id);q.make();
  const o=overlay(`<h2>Your room</h2><div class="qr">${q.createSvgTag(4)}</div><p style="font-size:20px;letter-spacing:3px;color:var(--bl2)">${me.id}</p><p>Ask a friend to scan this or type the ID. Keep this page open so they can connect.</p><div class="row" style="justify-content:center"><button class="btn" id="cp">Copy ID</button><button class="btn p" id="x">Close</button></div>`);
  o.querySelector('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(me.id);toast('ID copied')};o.querySelector('#x').onclick=o.close
}
async function scan(){
  const o=overlay('<h2>Scan a room QR</h2><video playsinline muted></video><p>Point the camera at their QR code.</p><div class="row" style="justify-content:center"><button class="btn p" id="x">Cancel</button></div>');
  o.querySelector('#x').onclick=o.close;const v=o.querySelector('video'),cv=document.createElement('canvas');
  try{o.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=o.stream;await v.play()}
  catch{o.close();return toast('Camera not available. Use https or localhost and allow access.')}
  (function tick(){
    if(o.stop)return;
    if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;const x=cv.getContext('2d');x.drawImage(v,0,0);
      const r=jsQR(x.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
      if(r&&/^royalroom:/i.test(r.data)){o.close();return join(r.data)}}
    requestAnimationFrame(tick)})()
}

/* ---------- calls ---------- */
async function media(kind){return navigator.mediaDevices.getUserMedia({audio:true,video:kind==='video'})}
function callUI(name){
  const d=document.createElement('div');d.className='call';d.id='callui';
  d.innerHTML=`<div><h2>${esc(name)}</h2></div><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div class="ctl"><button id="mic">🎙</button><button id="cam">📷</button><button class="end" id="end">✕</button></div>`;
  document.body.append(d);$('#lv').srcObject=lstream;
  $('#mic').onclick=()=>lstream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);
  $('#cam').onclick=()=>lstream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);
  $('#end').onclick=endCall
}
function hook(c){
  call=c;c.on('stream',s=>{const r=$('#rv');if(r)r.srcObject=s});c.on('close',endCall);c.on('error',endCall)
}
async function startCall(kind){
  if(!cur)return;if(!hasPeer(cur))return toast('Peer is offline.');
  try{lstream=await media(kind)}catch{return toast('Allow camera/microphone access (https or localhost required).')}
  callUI(rooms[cur].name);hook(peer.call(PID(cur),lstream,{metadata:{kind}}))
}
function incoming(c){
  const pid=c.peer.replace('royalroom-',''),kind=c.metadata&&c.metadata.kind||'voice';
  addRoom(pid);
  const o=overlay(`<h2>Incoming ${kind} call</h2><p style="font-size:18px;color:var(--tx)">${esc(rooms[pid].name)}</p><div class="row" style="justify-content:center"><button class="btn" id="no">Decline</button><button class="btn p" id="yes">Answer</button></div>`);
  o.onclick=null;
  o.querySelector('#no').onclick=()=>{c.close();o.close()};
  o.querySelector('#yes').onclick=async()=>{o.close();
    try{lstream=await media(kind)}catch{c.close();return toast('Could not access camera/microphone.')}
    open(pid);callUI(rooms[pid].name);c.answer(lstream);hook(c)};
  c.on('close',()=>o.isConnected&&o.close())
}
function endCall(){
  if(call){const c=call;call=null;try{c.close()}catch{}}
  if(lstream){lstream.getTracks().forEach(t=>t.stop());lstream=null}
  const d=$('#callui');if(d)d.remove()
}

/* ---------- events ---------- */
$('#bQR').onclick=showQR;$('#bScan').onclick=scan;
$('#bJoin').onclick=()=>{join($('#jid').value);$('#jid').value=''};
$('#jid').onkeydown=e=>{if(e.key==='Enter')$('#bJoin').click()};
$('#rid').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(me.id);toast('Room ID copied')};
$('#nm').onclick=()=>{const n=(prompt('Your name',me.name)||'').trim();if(n){me.name=n.slice(0,24);LS('me',me);Object.values(conns).forEach(c=>c.open&&c.send({t:'hello',name:me.name}));ui()}};
$('#bSend').onclick=send;$('#msg').onkeydown=e=>{if(e.key==='Enter')send()};
$('#bAtt').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&sendFile(f)};
$('#bVid').onclick=()=>startCall('video');$('#bVoi').onclick=()=>startCall('voice');
$('#bBack').onclick=()=>{cur=null;$('#app').classList.remove('open');$('#chat').hidden=true;$('#splash').hidden=false;ui()};
ui();start();
</script></body></html>
